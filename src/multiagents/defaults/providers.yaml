# How to drive each agent CLI. Adding an integration means adding a block here
# — no Python — provided the CLI can stream line-delimited JSON.
#
# Command building
#   args        argv after the binary. A token that is exactly "{name}" is
#               replaced whole; text is never format-substituted, so a prompt
#               containing braces cannot corrupt the command line.
#   resume      appended when continuing an existing session
#   permission  extra flags per profile: full | sandbox | readonly
#   optional    flags added only when the agent config supplies that key
#
# Stream parsing
#   Rules are ordered, first match wins. `match` lists dotted paths that must
#   all equal the given value; `fields` lifts dotted paths into the normalised
#   event. Unmatched lines become `raw` events rather than being dropped —
#   run `multiagents probe <provider>` to see what is not being classified.
#
# ALWAYS use the streaming output format, never a single-shot JSON result.
# Live status, silence detection and doom-loop detection all read this stream;
# a CLI that only reports at exit is a black box for its whole lifetime.

providers:

  opencode:
    bin: opencode
    # Script implementing the check/login contract; see auth/README.md.
    auth:
      script: opencode.sh
    notes: >
      Emits NDJSON events. Tool arguments live at part.state.input, which is
      what doom-loop detection hashes. Has no sandbox mode, so the `sandbox`
      profile is the same as `full` — noted here rather than silently implied.
    spawn:
      args: ["run", "{prompt}", "-m", "{model}", "--format", "json", "--dir", "{workdir}"]
      resume: ["-s", "{session_id}"]
      permission:
        full: ["--auto"]
        sandbox: ["--auto"]
        # NOT enforced read-only — see the note on the agy block below.
        readonly: ["--auto"]
      optional:
        variant: ["--variant", "{variant}"]
    # opencode reports PER-STEP deltas: each step_finish carries that step's
    # tokens and its own dollar cost, so they must be summed. This is the same
    # figure the web console's usage page shows.
    usage_mode: delta
    models_cmd: ["opencode", "models"]
    models_parse: lines
    # Which model namespaces `refresh-models` records as available.
    #   opencode/*     free zen tier, unmetered
    #   opencode-go/*  the Go subscription
    # deepinfra/* is deliberately excluded: those bill against a separate
    # DEEPINFRA_API_KEY rather than the subscription, so listing them would
    # invite agents onto an account you are not intending to spend from.
    # Add "deepinfra/*" here if you ever want them back.
    models_include:
      - "opencode/*"
      - "opencode-go/*"
    home_links:
      - ".local/share/opencode"
      - ".config/opencode"
      - ".cache/opencode"
    stream:
      format: ndjson
      session_id_paths: ["sessionID"]
      rules:
        - match: {type: "text"}
          as: text
          fields: {text: "part.text"}
        - match: {type: "tool_use"}
          as: tool
          fields:
            name: "part.tool"
            args: "part.state.input"
            state: "part.state.status"
        - match: {type: "step_finish"}
          as: step
          fields:
            tokens: "part.tokens"
            cost: "part.cost"
            state: "part.reason"
        - match: {type: "step_start"}
          as: step
          fields: {}

  agy:
    bin: agy
    auth:
      script: agy.sh
    notes: >
      Antigravity's headless CLI. Note that /usr/bin/antigravity is the GUI
      editor, not this. Supports a real --sandbox (terminal restrictions) and
      reports per-step usage, so budget roll-up is accurate mid-run.
      Without a permission flag, headless mode AUTO-DENIES every tool and the
      agent returns an empty response after burning its input tokens — which is
      why no profile here is flagless. Genuine least-privilege would need
      allow-rules in the CLI's own settings.json; until then, isolation comes
      from the worktree.
    spawn:
      args: ["-p", "{prompt}", "--model", "{model}", "--output-format", "stream-json", "--add-dir", "{workdir}"]
      resume: ["--conversation", "{session_id}"]
      permission:
        full: ["--dangerously-skip-permissions"]
        sandbox: ["--sandbox", "--dangerously-skip-permissions"]
        # `readonly` is sandboxed, NOT unprivileged. Neither CLI can be made
        # genuinely read-only from the command line: with no permission flag
        # agy auto-denies every tool and returns an empty response, so a
        # "read-only" agent configured that way cannot even read a file.
        # Read-only is therefore enforced by git isolation instead — the agent
        # works in its own worktree and its branch is dropped if it turns out
        # to be empty. `writes: false` states intent and controls cleanup; it
        # is not a permission boundary.
        readonly: ["--sandbox", "--dangerously-skip-permissions"]
      optional:
        effort: ["--effort", "{effort}"]
    # agy reports RUNNING TOTALS on every step, so they must be taken at their
    # maximum rather than added. It reports no cost at all.
    usage_mode: cumulative
    # Under docker, do NOT mount the host's copy of these paths. A private
    # directory is mounted over each one instead, so the container keeps its own
    # credentials and can never overwrite or downgrade the host's.
    #
    # agy needs this because its host credential does not survive
    # containerisation: the on-disk token in ~/.gemini/oauth_creds.json is
    # expired, and mounting the host's ~/.gemini merely gives the container a
    # dead credential to fail on. With a private ~/.gemini the container can
    # hold a login of its own — see `multiagents docker login agy`.
    container_private_home:
      - ".gemini"
    models_cmd: ["agy", "models"]
    models_parse: tsv
    home_links:
      # State and conversation history.
      - ".gemini/antigravity-cli"
      - ".gemini/antigravity"
      - ".gemini/config"
      # Google OAuth credentials, which live at the .gemini ROOT rather than
      # inside antigravity-cli. Omitting them fails only under docker, where
      # nothing outside this list is mounted — locally the absolute path still
      # resolves and hides the mistake.
      - ".gemini/oauth_creds.json"
      - ".gemini/google_accounts.json"
      - ".gemini/settings.json"
      - ".gemini/installation_id"
    stream:
      format: ndjson
      session_id_paths:
        - "init.conversation_id"
        - "step_update.conversation_id"
        - "result.conversation_id"
        - "conversation_id"
      rules:
        - match: {event: "step_update", "step_update.step_type": "tool"}
          as: tool
          fields:
            name: "step_update.tool_name"
            args: "step_update.tool_info.parameters"
            state: "step_update.state"
            step: "step_update.step_index"
        - match: {event: "step_update"}
          as: step
          fields:
            step: "step_update.step_index"
            state: "step_update.state"
            tokens: "step_update.usage"
        - match: {event: "result"}
          as: result
          fields:
            status: "result.status"
            text: "result.response"
            tokens: "result.usage"
        - match: {event: "init"}
          as: step
          fields: {}

  # Claude Code as a full provider: orchestrator AND delegate.
  claude:
    bin: claude
    auth:
      script: claude.sh
    notes: >
      The only one of the three that can be made genuinely read-only:
      --restricted removes the tools that run commands or code and ignores
      user/project/local settings files, and --tools names what remains. The
      others can only be sandboxed.
      Nests its reply in message.content[] as a list of typed blocks — thinking,
      tool_use and text interleaved, sometimes several in one event — which is
      why the rule engine addresses lists.
    # Where this CLI records the session it is running, so a supervisor can see
    # whether the orchestrator is doing anything without reading a word of the
    # conversation. `{slug}` is the working directory with `/`, `.` and `_`
    # folded to `-`, which is claude's own encoding.
    #
    # opencode keeps sessions in a sqlite database and agy in an opaque brain
    # directory; neither declares one, and a supervisor without this falls back
    # to process liveness and tree activity.
    transcript:
      dir: "~/.claude/projects/{slug}"
      glob: "*.jsonl"
      # Strings this CLI's own error handler writes into the chat log when it
      # stops being able to work. Matching these is not classifying model
      # prose: they are hardcoded by the CLI, in a known position, and the only
      # reason they need matching at all is that the CLI chose the chat log as
      # its error channel instead of stderr or an exit code.
      #
      # `resets` says whether waiting fixes it, and NOTHING HERE MAY GUESS AT
      # IT FROM THE WORDING. Measured 2026-09-09 against GET /api/oauth/usage:
      # this CLI prints "You've hit your monthly spend limit" when the FIVE-HOUR
      # window fills while the extra-usage credit pool — the thing that would
      # otherwise carry the session past it — happens to be spent. It names the
      # pool, not the wall, and then contradicts itself in its own second
      # clause: "your session limit resets 1pm". Waiting does fix it.
      #
      # So the wording does not identify the limit, and the two mistakes are
      # not equal: treating a window as a wall costs an afternoon of doing
      # nothing, while treating a wall as a window costs one wasted relaunch
      # per wait. Everything shipped is therefore `resets: true`. `false` stays
      # supported for a string that is one day *known* to mean a dead account —
      # and the honest signal for that is `extra_usage.spend_limit_reached` in
      # the usage payload, which is a boolean, not a sentence.
      limit_markers:
        - match: "hit your monthly spend limit"
          resets: true
          detail: "usage limit (the CLI words this as a spend limit; it is the rolling window)"
        - match: "hit your usage limit"
          resets: true
          detail: "usage limit; it resets on its own"
        - match: "session limit reached"
          resets: true
          detail: "session limit; it resets on its own"
    spawn:
      args: ["-p", "{prompt}", "--model", "{model}",
             "--output-format", "stream-json", "--verbose",
             "--strict-mcp-config"]
      resume: ["--resume", "{session_id}"]
      permission:
        full: ["--permission-mode", "bypassPermissions"]
        # No sandbox concept; bypassPermissions is as close as it gets.
        sandbox: ["--permission-mode", "bypassPermissions"]
        # Genuinely enforced, unlike the other two providers.
        readonly: ["--restricted", "--tools", "Read,Glob,Grep,WebFetch"]
      optional:
        max_budget_usd: ["--max-budget-usd", "{max_budget_usd}"]
    # No `claude models` command exists, so the list is static. Keep it short:
    # these are aliases the CLI resolves, so they do not go stale on a release.
    models:
      - {id: "sonnet", label: "Claude Sonnet (latest)"}
      - {id: "opus", label: "Claude Opus (latest)"}
      - {id: "haiku", label: "Claude Haiku (latest)"}
      - {id: "claude-haiku-4-5-20251001", label: "Claude Haiku 4.5 (pinned)"}
    # One result event carries the run total.
    usage_mode: cumulative
    # The container gets its OWN ~/.claude, backed by a directory under our
    # state dir, rather than sharing the host's credential file.
    #
    # Sharing the file cannot work, and the reason is one line of Unix: docker
    # binds a FILE by inode. The CLI rewrites its credential the safe way — new
    # file, rename over the old — so a refresh on the host is invisible inside
    # the container, and a refresh INSIDE the container fails outright with
    # `mv: Resource busy`. Both were measured. A DIRECTORY mount is correct in
    # both directions, which is what this is.
    #
    # It costs one login for the container profile, done on the host with
    # CLAUDE_CONFIG_DIR pointed at the backing directory — no browser inside a
    # container. It also stops mounting the host's ~/.claude at all, so the
    # transcripts of every past conversation are no longer reachable by an
    # agent, which the file mount left exposed.
    container_private_home:
      - ".claude"
    # Carried into that private profile so an agent is not a factory-reset CLI:
    # permissions, model choice, plugins, hooks. Secret-bearing keys (`env`, an
    # api-key helper) are stripped on the way in — agents are not handed
    # credentials through a config file any more than through the environment.
    container_private_seed:
      - ".claude/settings.json"
    # Removed from the profile when the container starts. A daemon lock names a
    # host pid the container cannot signal, and the CLI that finds one spends
    # time working out that it is meaningless.
    container_private_reset:
      - ".claude/daemon.lock"
      - ".claude/daemon.status.json"
      - ".claude/daemon"
    # The DIRECTORY, not the files inside it. A per-agent HOME links these into
    # place, and a link to a FILE is destroyed by the thing this whole provider
    # does routinely: the CLI refreshes its token by writing a temp file and
    # renaming over the path, which replaces the symlink with a plain file. The
    # refreshed token then sits in an agent's throwaway home, the shared profile
    # keeps the old one — and that refresh has just rotated the old one away, so
    # every other agent is now holding a revoked credential. Measured; it is the
    # mechanism that survived fixing the mount.
    #
    # Linking the directory instead means a refresh renames INSIDE the shared
    # profile, where every agent sees it. `.claude.json` stays per-agent through
    # home_copy below, so concurrent agents still cannot corrupt each other's
    # config: with CLAUDE_CONFIG_DIR unset the CLI keeps that file beside HOME,
    # not inside the profile.
    home_links:
      - ".claude"
    # COPIED, not linked. ~/.claude.json is 136K of project history plus the
    # cachedUsageUtilization the budget adapter reads. Symlinking it would have
    # every concurrent subagent writing the user's real config. Copying also
    # means it is never bind-mounted into a container, so it stays invisible
    # there — an isolation property the README claims and tests check.
    home_copy:
      - ".claude.json"
    stream:
      format: ndjson
      session_id_paths: ["session_id"]
      rules:
        # Ordered: an assistant event carrying a tool_use block is a tool call
        # even when a thinking block precedes it in the same content list.
        - match: {type: "assistant", "message.content[type=tool_use].type": "tool_use"}
          as: tool
          fields:
            name: "message.content[type=tool_use].name"
            args: "message.content[type=tool_use].input"
        - match: {type: "assistant", "message.content[type=text].type": "text"}
          as: text
          fields:
            text: "message.content[type=text].text"
        - match: {type: "result"}
          as: result
          fields:
            status: "subtype"
            tokens: "usage"
            cost: "total_cost_usd"
          # NOTE: deliberately no `text`. Claude emits its answer as an
          # assistant/text event AND repeats it in result.result; mapping both
          # makes every reply appear twice. agy maps text here because it has no
          # separate text event — the difference is exactly what rules are for.
        # Everything below is progress rather than content, but must still be
        # classified: an unmatched line becomes a `raw` event, which works but
        # makes `multiagents probe` unable to tell a missing rule from a
        # deliberately-ignored one.
        - match: {type: "assistant"}
          as: step
          fields: {}
        - match: {type: "user"}
          as: step
          fields: {}
        - match: {type: "system"}
          as: step
          fields: {}
        # Claude reports live rate-limit state in-band. Classified now; a future
        # budget adapter can read rate_limit_info from the raw payload rather
        # than the cached ~/.claude.json.
        - match: {type: "rate_limit_event"}
          as: step
          fields: {}

  # ---------------------------------------------------------------------
  # Template for a new integration. Uncomment, fill in, then verify with
  #   multiagents probe <name>
  # which runs a trivial task and reports which rules matched what.
  # ---------------------------------------------------------------------
  #
  # myclie:
  #   bin: myclie
  #   spawn:
  #     args: ["--headless", "{prompt}", "--model", "{model}"]
  #     resume: ["--session", "{session_id}"]
  #     permission:
  #       full: ["--yes"]
  #       sandbox: []
  #       readonly: []
  #   models_cmd: ["myclie", "list-models"]
  #   models_parse: lines          # lines | tsv
  #   home_links: [".config/myclie"]
  #   stream:
  #     format: ndjson             # ndjson | text
  #     session_id_paths: ["session"]
  #     rules:
  #       - match: {kind: "assistant"}
  #         as: text
  #         fields: {text: "message.content"}
  #       - match: {kind: "tool_call"}
  #         as: tool
  #         fields: {name: "tool.name", args: "tool.arguments"}

  # ---------------------------------------------------------------------
  # A SECOND ACCOUNT ON THE SAME CLI
  #
  # Two subscriptions are two providers: same binary, same script, same
  # parsing, different credentials. `extends` copies the integration so this is
  # four lines rather than a duplicated block, and `family` says the two share a
  # MODEL NAMESPACE — which is what makes failover between them free. `opus`
  # means the same thing on both accounts, so no agent needs a `models:` entry
  # to move from one to the other.
  #
  # `env` is what actually separates them, and it is applied to every action as
  # well as to every agent run. Measured on this machine rather than assumed:
  # CLAUDE_CONFIG_DIR relocates claude's whole state — credentials, config,
  # transcripts, even the daemon lock — and XDG_DATA_HOME does the same for
  # opencode. agy is the exception: its host credential lives in the GNOME
  # keyring, which no environment variable moves, so a second agy account needs
  # a container profile of its own instead.
  #
  # Then: `multiagents auth login claude-b`, which signs that profile in with
  # your own browser, and the roster needs no change at all — the agents' pins
  # choose the family, and the router chooses which account runs the work.
  #
  # claude-b:
  #   extends: claude
  #   env:
  #     CLAUDE_CONFIG_DIR: "~/.multiagents/profiles/claude-b"
  #   # Under docker, an instance needs its OWN container profile path, or two
  #   # instances would be two mounts at one destination and both would
  #   # authenticate as whichever won. Checked at load time, not left to chance.
  #   container_private_home: [".claude-b"]
  #
  # opencode-b:
  #   extends: opencode
  #   env:
  #     XDG_DATA_HOME: "~/.multiagents/profiles/opencode-b/share"
  #     XDG_CONFIG_HOME: "~/.multiagents/profiles/opencode-b/config"
  #
  # `family` is what makes the two INTERCHANGEABLE, and that is a choice. Two
  # accounts you keep apart on purpose — work and personal, two clients, two
  # billing lines — should not be interchangeable, and saying so is one line:
  #
  # claude-personal:
  #   extends: claude
  #   family: claude-personal        # its own family of one: never failed over to
  #   env: {CLAUDE_CONFIG_DIR: "~/.multiagents/profiles/personal"}
  #
  # What the router then does, in the owner's words and in this order:
  #   * an agent pinned to the orchestrator's account runs on the OTHER one
  #     while it can, so the orchestrator keeps a window to read results in;
  #   * among the other accounts it picks the least busy, counted from the tree
  #     so every agent process ranks them the same way — never "the most
  #     headroom", which is a stale percentage that pins ten spawns to one
  #     account and annihilates it before the next reading;
  #   * if they are all full but one comes back within
  #     `budget.wait_for_reset_seconds`, the work WAITS rather than moving;
  #   * only a long exhaustion sends work to the orchestrator's account, and
  #     even then only while that account is above `budget.reserve_headroom`.
