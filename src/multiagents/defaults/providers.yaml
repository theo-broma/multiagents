# Prompt transport: spawn.prompt_transport is argv (legacy default), stdin,
# or file. stdin sends the run file as message text; stdin_format: stream-json
# frames one user message for a CLI requiring NDJSON. file renders the whole
# {prompt_file} token in spawn.args. Non-argv args must omit {prompt}.
# Each launch keeps a distinct 0600 prompt file until the run directory is
# removed; prompt.md remains the initial diagnostic copy. The byte bound is
# limits.prompt_file_max_bytes (default 16 MiB), on writing and consumption.
# How to drive each agent CLI. Adding an integration means adding a block here
# — no Python in the package — provided the CLI can stream line-delimited JSON.
# The script the block names may be written in any language: a `.sh` runs under
# `sh`, anything else runs itself. See providers/README.md.
#
# Command building
#   args        argv after the binary. A token that is exactly "{name}" is
#               replaced whole; text is never format-substituted, so a prompt
#               containing braces cannot corrupt the command line.
#   resume      appended when continuing an existing session
#   permission  extra flags per profile: full | sandbox | readonly
#   optional    flags added only when the agent config supplies that key
#
# Stream parsing
#   Rules are ordered, first match wins. `match` lists dotted paths that must
#   all equal the given value; `fields` lifts dotted paths into the normalised
#   event. Unmatched lines become `raw` events rather than being dropped —
#   run `multiagents probe <provider>` to see what is not being classified.
#
# ALWAYS use the streaming output format, never a single-shot JSON result.
# Live status, silence detection and doom-loop detection all read this stream;
# a CLI that only reports at exit is a black box for its whole lifetime.
#
# Sharing tooling between providers (PS-R1/R5). Three keys let providers share
# one CLI's plumbing while keeping their own models and their own quota:
#   auth_from: <provider>    borrow that provider's credentials everywhere:
#                            its check, its login, its container profile and
#                            its refresh, and its `env:` (overlaid with this
#                            block's own). One level only: the owner may
#                            not itself declare `auth_from`.
#   bin_search: [dirs]      extra CLI directories, searched after PATH;
#                            core then falls back to ~/.local/bin for all providers.
#   budget_from: <provider>  read this provider's quota from that provider's
#                            budget source — the payload is fetched once per
#                            cache period and shared. One level only, too.
#   budget_windows: [globs]  which windows of a budget payload COUNT for this
#                            provider (glob over the window keys, e.g.
#                            "gemini*"). Allowed on any provider; on the
#                            quota source it restricts the source too. Absent,
#                            the payload's own `counted` flags stand.
# An existing install adopts the split without touching its overrides: add a
# block like the `agy-partner` example below, whose `extends:` copies the
# integration and whose `family:` keeps it out of agy's failover set.
# The split lives in the shipped defaults; a global or project override that
# does not name these keys keeps them from the defaults (provider blocks
# deep-merge), and one that replaces `models_include:` replaces it outright.

# instance_strategy: optional family instance selection override, inherited
# through extends. Explicit null clears an inherited value and uses
# budget.instance_strategy. The preferred provider's effective setting governs
# the whole pool; siblings' settings apply when they themselves are preferred.
# Values: soonest_reset (default), shortest_window_least_remaining,
# shortest_window_most_remaining, longest_window_least_remaining,
# longest_window_most_remaining, least_loaded. Global defaults and tolerances
# live in project.yaml's budget block, layered project over global over shipped.
# This selects provider instances, not accounts inside the claude sidecar vault.
providers:

  opencode:
    bin: opencode
    bin_search: ["~/.opencode/bin"]
    # Script implementing the check/login contract; see auth/README.md.
    auth:
      script: opencode.sh
    notes: >
      Emits NDJSON events. Tool arguments live at part.state.input, which is
      what doom-loop detection hashes. Has no sandbox mode, so the `sandbox`
      profile is the same as `full` — noted here rather than silently implied.
    spawn:
      prompt_transport: stdin
      args: ["run", "-m", "{model}", "--format", "json", "--dir", "{workdir}"]
      resume: ["-s", "{session_id}"]
      permission:
        full: ["--auto"]
        sandbox: ["--auto"]
        # NOT enforced read-only — see the note on the agy block below.
        readonly: ["--auto"]
      optional:
        variant: ["--variant", "{variant}"]
    # The multiagents server for an agent with spawn rights (see the claude
    # block for the placeholders). OPENCODE_CONFIG names a file layered over
    # the user's own config, which is how `prepare` gives the orchestrator the
    # server too — the user's opencode.json is never touched.
    mcp:
      file: opencode.json
      config:
        $schema: "https://opencode.ai/config.json"
        mcp:
          multiagents:
            type: local
            enabled: true
            command: "{mcp_argv}"
            environment: "{mcp_env}"
      env:
        OPENCODE_CONFIG: "{mcp_config}"
    # opencode reports PER-STEP deltas: each step_finish carries that step's
    # tokens and its own dollar cost, so they must be summed. This is the same
    # figure the web console's usage page shows.
    usage_mode: delta
    models_cmd: ["opencode", "models"]
    models_parse: lines
    # Which model namespaces `refresh-models` records as available.
    #   opencode/*     free zen tier, unmetered
    #   opencode-go/*  the Go subscription
    # deepinfra/* is deliberately excluded here: those models bill against a
    # separate DEEPINFRA_API_KEY rather than the subscription. They have their
    # own instance below — see `opencode-deepinfra`.
    models_include:
      - "opencode/*"
      - "opencode-go/*"
    home_links:
      - ".local/share/opencode"
      - ".config/opencode"
      - ".cache/opencode"
    stream:
      format: ndjson
      session_id_paths: ["sessionID"]
      rules:
        - match: {type: "text"}
          as: text
          # Each text event is one whole part; its id tells parts apart.
          fields: {text: "part.text", block: "part.id"}
        - match: {type: "tool_use"}
          as: tool
          fields:
            name: "part.tool"
            args: "part.state.input"
            state: "part.state.status"
        - match: {type: "step_finish"}
          as: step
          # OpenCode stores the model's finishReason in part.reason.
          status_map:
            part.reason:
              content-filter: REFUSED
              length: TRUNCATED
          fields:
            tokens: "part.tokens"
            cost: "part.cost"
            state: "part.reason"
            # SC-R2a: the part's unique id (`prt_…`) dedups the spend ledger.
            step_id: "part.id"
        - match: {type: "step_start"}
          as: step
          fields: {}

  # The Z.AI GLM Coding Plan through opencode: same CLI, script and stream
  # rules, but its own family (its billing and models are unrelated to OpenCode
  # Go, so failover between the two is never implicit) and real quota tracking
  # from api.z.ai. Ships disabled. To enable it, set `enabled: true` for
  # `opencode-zai` in .multiagents/config/providers.yaml, then run
  # `multiagents auth login opencode-zai` and choose Z.AI Coding Plan.
  # MULTIAGENTS_ZAI_ORIGIN overrides the quota endpoint's origin for tests only.
  opencode-zai:
    extends: opencode
    family: opencode-zai
    enabled: false
    billing: plan
    models_include: ["zai-coding-plan/*"]
    env:
      MULTIAGENTS_OPENCODE_PLAN: zai-coding-plan

  # DeepInfra models through the same opencode CLI: its own family (DeepInfra
  # bills real money against its own DEEPINFRA_API_KEY, unrelated to the Go
  # subscription or the Z.AI plan, so failover to it is never implicit) and
  # metered billing — every token is a real dollar cost the stream reports.
  # There is no quota surface to read, so `budget` reports unknown headroom
  # and never probes anything.
  #
  # Ships DISABLED. To enable it, set `enabled: true` for `opencode-deepinfra`
  # in .multiagents/config/providers.yaml, then run
  # `multiagents auth login opencode-deepinfra` and choose Deep Infra.
  opencode-deepinfra:
    extends: opencode
    family: opencode-deepinfra
    enabled: false
    billing: metered
    models_include: ["deepinfra/*"]
    env:
      MULTIAGENTS_OPENCODE_PLAN: deepinfra

  agy:
    handover_mode: {docker: none, local: none}
    bin: agy
    budget_profile_env: HOME
    # The host keyring is shared even when HOME is relocated. In the
    # container, each HOME instead owns a persistent file token.
    home_account_executor: docker
    auth:
      script: agy.sh
    notes: >
      Antigravity's headless CLI. Note that /usr/bin/antigravity is the GUI
      editor, not this. Supports a real --sandbox (terminal restrictions) and
      reports per-step usage, so budget roll-up is accurate mid-run.
      Without a permission flag, headless mode AUTO-DENIES every tool and the
      agent returns an empty response after burning its input tokens — which is
      why no profile here is flagless. Genuine least-privilege would need
      allow-rules in the CLI's own settings.json; until then, isolation comes
      from the worktree.
    # Sent to the model itself (see P0-R3), unlike `notes:` above.
    agent_guidance: >
      Your `view_file` tool truncates long files. When its output ends with
      "The above content does NOT show the entire file contents... call this
      tool again to view those lines", that is not the end of the file — call
      `view_file` again on the same `AbsolutePath` with `StartLine` set past
      what you already saw (and `EndLine` if you want a bounded chunk).
      Never treat a truncated read as the whole file.

      Run long commands (a test suite) in the foreground and wait for their
      output. Do not start them as background tasks and poll `manage_task`: a
      background job is not observed once your turn ends, and repeated polls
      are read as a loop. If one call cannot finish in time, split the work
      into several foreground calls. Never end your turn while a command you
      started is still running.
    spawn:
      # --print-timeout is NOT optional. Without it agy stops a turn at its own
      # default of 5 minutes, prints "print timeout after 5m0s with turn in
      # progress; returning partial output", flushes a clean final event and
      # exits 0 — so a truncated run parses perfectly and reads as a finished
      # one. Measured 2026-09-14: every agy run in a real project that day
      # lasted 5.0-5.1 minutes and two of them merged half a turn into main.
      prompt_transport: stdin
      stdin_format: stream-json
      # Print takes a string argument. An empty value selects print mode
      # without supplying a second user message beside the stdin stream.
      args: ["-p", "", "--input-format", "stream-json", "--model", "{model}", "--output-format", "stream-json",
             "--add-dir", "{workdir}", "--print-timeout", "{timeout_s}"]
      resume: ["--conversation", "{session_id}"]
      permission:
        full: ["--dangerously-skip-permissions"]
        sandbox: ["--sandbox", "--dangerously-skip-permissions"]
        # `readonly` is sandboxed, NOT unprivileged. Neither CLI can be made
        # genuinely read-only from the command line: with no permission flag
        # agy auto-denies every tool and returns an empty response, so a
        # "read-only" agent configured that way cannot even read a file.
        # Read-only is therefore enforced by git isolation instead — the agent
        # works in its own worktree and its branch is dropped if it turns out
        # to be empty. `writes: false` states intent and controls cleanup; it
        # is not a permission boundary.
        readonly: ["--sandbox", "--dangerously-skip-permissions"]
      optional:
        effort: ["--effort", "{effort}"]
    # The model ids carry their effort as a suffix, and the CLI refuses a
    # contradicting `--effort` at launch ("--model gemini-3.8-flash-medium
    # conflicts with --effort=low"). Declared here, the runner settles the
    # pair before launch (RM-R5a): an inherited effort is normalised to the
    # model's, an effort explicitly written on the destination route is
    # refused, and an id with no matching suffix implies nothing.
    effort_suffixes:
      "-low": low
      "-medium": medium
      "-high": high
    # The multiagents server for an agent with spawn rights (see the claude
    # block for the placeholders). agy has no flag or variable naming an MCP
    # config: it reads ~/.gemini/config/mcp_config.json and nothing else
    # (checked 2026-09-23 against `agy --help` and `agy mcp add` under a
    # scratch HOME). So the file goes in the agent's private HOME, which is
    # this launch's own; the linked `.gemini/config` is replaced there by a
    # directory of links so the write cannot reach the user's copy. `merge`
    # keeps the servers the user registered, so the agent loses none of them.
    # Under `home_policy: shared` there is no private HOME to put it in, and
    # the run records the server as unavailable instead.
    mcp:
      home_file: .gemini/config/mcp_config.json
      merge: true
      config:
        mcpServers:
          multiagents:
            command: "{mcp_command}"
            args: "{mcp_args}"
            env: "{mcp_env}"
    # agy reports RUNNING TOTALS on every step, so they must be taken at their
    # maximum rather than added. It reports no cost at all.
    # Text the CLI prints when it cut the turn short ITSELF. Matched against
    # stderr, case-insensitively. A run that matches is `truncated`, never
    # `done`, so it cannot be merged as though it had finished — and it is not
    # counted against the provider either, for the same reason `limited` is
    # not: the provider did exactly what it was asked, the budget ran out.
    truncation_markers:
      - "print timeout"
    refusal_markers:
      - "This request was blocked by Gemini's filters.*"
    usage_mode: cumulative
    # Paid through the subscription, not per-token.
    billing: plan
    # SL-R6 (bug-2cebea): `view_file`'s reported arguments do not identify the
    # call — the streamed tool_info.parameters carries only AbsolutePath, never
    # the StartLine/EndLine a re-read at a different range actually used, so
    # two different reads of the same file hash identically and doom_loop trips
    # on ordinary re-reading. Checked whether this was a parser gap first: the
    # stream rule below maps tool_info.parameters straight into args with
    # nothing filtered out, so if the raw stream ever carried a range our own
    # recorded args would already show it — and across the real streams
    # available to check, it never does. Declared opaque instead of mapped.
    opaque_tools:
      - view_file
    # bug-8615db: `manage_task` is agy's background-task tool. Checking on a
    # task already started (`Action: status`, or `Action: list` for every
    # task) reports the same TaskId each time by design while a backgrounded
    # command still runs — that repetition is the wait for it to finish, not
    # a doom loop, and must not trip on its own. `Action: run`, which starts
    # a task, is deliberately left off this list: repeating THAT is exactly
    # the loop doom_loop exists to catch.
    opaque_tool_args:
      - tool: manage_task
        match:
          Action: [status, list]
    # Under docker, do NOT mount the host's copy of these paths. A private
    # directory is mounted over each one instead, so the container keeps its own
    # credentials and can never overwrite or downgrade the host's.
    #
    # agy needs this because its host credential does not survive
    # containerisation: the on-disk token in ~/.gemini/oauth_creds.json is
    # expired, and mounting the host's ~/.gemini merely gives the container a
    # dead credential to fail on. With a private ~/.gemini the container can
    # hold a login of its own — see `multiagents docker login agy`.
    container_private_home:
      - ".gemini"
    models_cmd: ["agy", "models"]
    models_parse: tsv
    # PS-R8/R8a: agy bills two pools from one binary, and only the Gemini one
    # is this provider's. The allowlist keeps its catalog to the models it
    # actually spends against; `budget_windows` keeps its headroom to the
    # windows that bill it. The Claude/GPT buckets stay in the reading,
    # marked `counted: false`, for agy-partner to claim.
    models_include:
      - "gemini-*"
    budget_windows:
      - "gemini*"
    home_links:
      # State and conversation history.
      - ".gemini/antigravity-cli"
      - ".gemini/antigravity"
      - ".gemini/config"
      # Google OAuth credentials, which live at the .gemini ROOT rather than
      # inside antigravity-cli. Omitting them fails only under docker, where
      # nothing outside this list is mounted — locally the absolute path still
      # resolves and hides the mistake.
      - ".gemini/oauth_creds.json"
      - ".gemini/google_accounts.json"
      - ".gemini/settings.json"
      - ".gemini/installation_id"
    stream:
      format: ndjson
      session_id_paths:
        - "init.conversation_id"
        - "step_update.conversation_id"
        - "result.conversation_id"
        - "conversation_id"
      rules:
        - match: {event: "step_update", "step_update.step_type": "tool"}
          as: tool
          fields:
            name: "step_update.tool_name"
            args: "step_update.tool_info.parameters"
            state: "step_update.state"
            step: "step_update.step_index"
        - match: {event: "step_update"}
          as: step
          fields:
            step: "step_update.step_index"
            state: "step_update.state"
            tokens: "step_update.usage"
        - match: {event: "result"}
          as: result
          fields:
            status: "result.status"
            text: "result.response"
            tokens: "result.usage"
        - match: {event: "init"}
          as: step
          fields: {}

  # PS-R8: agy's OTHER pool, as its own provider. Same CLI, same login, same
  # budget script — `extends:` copies the integration, `auth_from:` shares the
  # credentials, `budget_from:` shares the quota reading — but its own family
  # (failover between the two is never implicit), its own allowlist and its
  # own `budget_windows`, so each is constrained only by the windows that
  # actually bill it. A full partner bucket leaves agy usable, and a full
  # Gemini bucket leaves the partner usable. Nothing routes here until an
  # agent names one of its models.
  #
  # No `notes:` of its own on purpose: the inherited agy notes describe the
  # Gemini pool and would be wrong here. Document the split in comments, and
  # let the budget reading's generic note stand in for one.
  agy-partner:
    extends: agy
    family: agy-partner
    auth_from: agy
    budget_from: agy
    models_include:
      - "claude-*"
      - "gpt-*"
    budget_windows:
      - "3p-*"

  # Claude Code as a full provider: orchestrator AND delegate.
  claude:
    handover_mode: {docker: shared, local: none}
    bin: claude
    # The variable that relocates this CLI's whole state to a second account.
    # `claude-b` (see the commented block below) inherits it through `extends`;
    # the built-in quota reader resolves the instance's own value so the two
    # subscriptions are never conflated.
    budget_profile_env: CLAUDE_CONFIG_DIR
    auth:
      script: claude.sh
    notes: >
      The only one of the three that can be made genuinely read-only:
      --restricted removes the tools that run commands or code and ignores
      user/project/local settings files, and --tools names what remains. The
      others can only be sandboxed.
      Nests its reply in message.content[] as a list of typed blocks — thinking,
      tool_use and text interleaved, sometimes several in one event — which is
      why the rule engine addresses lists.
    # Sent to the model itself (see P0-R3). Observed 2026-09-23/24: agents
    # ended their turn with the suite still running, because the Bash tool
    # backgrounds a command after 2 minutes unless the call passes `timeout`.
    agent_guidance: >
      Your Bash tool moves a command to the background after 2 minutes unless
      you pass its `timeout` parameter. In this session nothing wakes you when
      a background command finishes, and ScheduleWakeup and Monitor do not
      bring you back. So for anything that can take longer (a test suite),
      pass `timeout: 600000`. If the whole run can exceed 10 minutes, split it
      into several foreground calls, for example by groups of test files.
      Never end your turn while a command you started is still running, and
      never report a result you did not see.
    # Where this CLI records the session it is running, so a supervisor can see
    # whether the orchestrator is doing anything without reading a word of the
    # conversation. `{slug}` is the working directory with `/`, `.` and `_`
    # folded to `-`, which is claude's own encoding.
    #
    # opencode keeps sessions in a sqlite database and agy in an opaque brain
    # directory; neither declares one, and a supervisor without this falls back
    # to process liveness and tree activity.
    transcript:
      dir: "~/.claude/projects/{slug}"
      glob: "*.jsonl"
      # Context reading: dot-separated usage object path and token fields summed.
      # Both are required; no declaration leaves context size unknown.
      usage_path: "message.usage"
      context_fields: [input_tokens, cache_read_input_tokens, cache_creation_input_tokens]
      # Strings this CLI's own error handler writes into the chat log when it
      # stops being able to work. Matching these is not classifying model
      # prose: they are hardcoded by the CLI, in a known position, and the only
      # reason they need matching at all is that the CLI chose the chat log as
      # its error channel instead of stderr or an exit code.
      #
      # `resets` says whether waiting fixes it, and NOTHING HERE MAY GUESS AT
      # IT FROM THE WORDING. Measured 2026-09-09 against GET /api/oauth/usage:
      # this CLI prints "You've hit your monthly spend limit" when the FIVE-HOUR
      # window fills while the extra-usage credit pool — the thing that would
      # otherwise carry the session past it — happens to be spent. It names the
      # pool, not the wall, and then contradicts itself in its own second
      # clause: "your session limit resets 1pm". Waiting does fix it.
      #
      # So the wording does not identify the limit, and the two mistakes are
      # not equal: treating a window as a wall costs an afternoon of doing
      # nothing, while treating a wall as a window costs one wasted relaunch
      # per wait. Everything shipped is therefore `resets: true`. `false` stays
      # supported for a string that is one day *known* to mean a dead account —
      # and the honest signal for that is `extra_usage.spend_limit_reached` in
      # the usage payload, which is a boolean, not a sentence.
      limit_markers:
        - match: "hit your monthly spend limit"
          resets: true
          detail: "usage limit (the CLI words this as a spend limit; it is the rolling window)"
        - match: "hit your usage limit"
          resets: true
          detail: "usage limit; it resets on its own"
        - match: "session limit reached"
          resets: true
          detail: "session limit; it resets on its own"
    spawn:
      prompt_transport: stdin
      args: ["-p", "--model", "{model}",
             "--output-format", "stream-json", "--verbose",
             "--strict-mcp-config"]
      resume: ["--resume", "{session_id}"]
      permission:
        full: ["--permission-mode", "bypassPermissions"]
        # No sandbox concept; bypassPermissions is as close as it gets.
        sandbox: ["--permission-mode", "bypassPermissions"]
        # Genuinely enforced, unlike the other two providers.
        readonly: ["--restricted", "--tools", "Read,Glob,Grep,WebFetch"]
      optional:
        max_budget_usd: ["--max-budget-usd", "{max_budget_usd}"]
        autocompact: ["--autocompact", "{autocompact}"]
    # How an agent with spawn rights is handed the multiagents MCP server
    # (SM-R1); one without them never is (SM-R2). Placeholders are whole
    # values, filled in per spawn: {mcp_command} and {mcp_args} (or both as
    # one list, {mcp_argv}), {mcp_env} — the agent's own identity, so every
    # call is attributed to it — and {mcp_config}, the path `config` is
    # written to. `file` puts that under the run's own directory; `home_file`
    # puts it in the agent's private HOME instead, for a CLI that reads its
    # servers from nowhere else. The user's own configuration is never written.
    #
    # --strict-mcp-config stays in `spawn.args`, so the agent loads this one
    # server and none of the user's. Appended after every other flag, because
    # --mcp-config takes a variable number of values.
    mcp:
      file: mcp.json
      config:
        mcpServers:
          multiagents:
            type: stdio
            command: "{mcp_command}"
            args: "{mcp_args}"
            env: "{mcp_env}"
      args: ["--mcp-config", "{mcp_config}"]
      # SM-R5: the init event names every server and whether it started. A
      # server that failed does not stop the CLI; it is recorded, so a consult
      # that never happened has a visible reason.
      unavailable:
        match: {type: "system", subtype: "init"}
        status: "mcp_servers[name=multiagents].status"
        values: ["failed", "needs-auth"]
    # No `claude models` command exists, so the list is static. Keep it short:
    # these are aliases the CLI resolves, so they do not go stale on a release.
    models:
      - {id: "sonnet", label: "Claude Sonnet (latest)"}
      - {id: "opus", label: "Claude Opus (latest)"}
      - {id: "haiku", label: "Claude Haiku (latest)"}
      - {id: "claude-haiku-4-5-20251001", label: "Claude Haiku 4.5 (pinned)"}
    # One result event carries the run total.
    usage_mode: cumulative
    # The container gets its OWN ~/.claude, backed by a directory under our
    # state dir, rather than sharing the host's credential file.
    #
    # Sharing the file cannot work, and the reason is one line of Unix: docker
    # binds a FILE by inode. The CLI rewrites its credential the safe way — new
    # file, rename over the old — so a refresh on the host is invisible inside
    # the container, and a refresh INSIDE the container fails outright with
    # `mv: Resource busy`. Both were measured. A DIRECTORY mount is correct in
    # both directions, which is what this is.
    #
    # It costs one login for the container profile, done on the host with
    # CLAUDE_CONFIG_DIR pointed at the backing directory — no browser inside a
    # container. It also stops mounting the host's ~/.claude at all, so the
    # transcripts of every past conversation are no longer reachable by an
    # agent, which the file mount left exposed.
    container_private_home:
      - ".claude"
    # Carried into that private profile so an agent is not a factory-reset CLI:
    # permissions, model choice, plugins, hooks. Secret-bearing keys (`env`, an
    # api-key helper) are stripped on the way in — agents are not handed
    # credentials through a config file any more than through the environment.
    container_private_seed:
      - ".claude/settings.json"
    # Removed from the profile when the container starts. A daemon lock names a
    # host pid the container cannot signal, and the CLI that finds one spends
    # time working out that it is meaningless.
    container_private_reset:
      - ".claude/daemon.lock"
      - ".claude/daemon.status.json"
      - ".claude/daemon"
      # A bare mkdir mutex: an empty DIRECTORY naming no owner, so nothing can
      # ask whether the holder is alive. An agent that begins a refresh it
      # cannot finish leaves one, and every later refresh — the host's
      # included — then fails with "another Claude Code process is refreshing
      # it". Observed 2026-09-16 blocking the host from renewing the
      # container's token at all.
      - ".claude/.oauth_refresh.lock"
    # The DIRECTORY, not the files inside it. A per-agent HOME links these into
    # place, and a link to a FILE is destroyed by the thing this whole provider
    # does routinely: the CLI refreshes its token by writing a temp file and
    # renaming over the path, which replaces the symlink with a plain file. The
    # refreshed token then sits in an agent's throwaway home, the shared profile
    # keeps the old one — and that refresh has just rotated the old one away, so
    # every other agent is now holding a revoked credential. Measured; it is the
    # mechanism that survived fixing the mount.
    #
    # Linking the directory instead means a refresh renames INSIDE the shared
    # profile, where every agent sees it. `.claude.json` stays per-agent through
    # home_copy below, so concurrent agents still cannot corrupt each other's
    # config: with CLAUDE_CONFIG_DIR unset the CLI keeps that file beside HOME,
    # not inside the profile.
    home_links:
      - ".claude"
    # COPIED, not linked. ~/.claude.json is 136K of project history plus the
    # cachedUsageUtilization the budget adapter reads. Symlinking it would have
    # every concurrent subagent writing the user's real config. Copying also
    # means it is never bind-mounted into a container, so it stays invisible
    # there — an isolation property the README claims and tests check.
    home_copy:
      - ".claude.json"
    stream:
      format: ndjson
      session_id_paths: ["session_id"]
      # PS-R4a: an API error is not startup progress. Claude Code prints one
      # as an assistant message from the model "<synthetic>" (the shape
      # transcripts.py already knows), inside a result whose `is_error` is
      # true. A run that only reports an API error never ran the model, so it
      # counts as a startup failure and a probe that only reports one does
      # not recover the provider.
      no_progress:
        - {type: "assistant", "message.model": "<synthetic>"}
        - {type: "result", "is_error": true}
      rules:
        # Ordered: an assistant event carrying a tool_use block is a tool call
        # even when a thinking block precedes it in the same content list.
        - match: {type: "assistant", "message.content[type=tool_use].type": "tool_use"}
          as: tool
          fields:
            name: "message.content[type=tool_use].name"
            args: "message.content[type=tool_use].input"
            turn: "message.id"
        - match: {type: "assistant", "message.content[type=text].type": "text"}
          as: text
          fields:
            text: "message.content[type=text].text"
            turn: "message.id"
            # One whole content block per line (no partial messages); several
            # lines share message.id, so the line's own uuid tells them apart.
            block: "uuid"
        - match: {type: "result"}
          as: result
          status_map:
            stop_reason:
              refusal: REFUSED
            subtype:
              error_max_turns: TRUNCATED
          fields:
            status: "subtype"
            tokens: "usage"
            cost: "total_cost_usd"
          # NOTE: deliberately no `text`. Claude emits its answer as an
          # assistant/text event AND repeats it in result.result; mapping both
          # makes every reply appear twice. agy maps text here because it has no
          # separate text event — the difference is exactly what rules are for.
        # Everything below is progress rather than content, but must still be
        # classified: an unmatched line becomes a `raw` event, which works but
        # makes `multiagents probe` unable to tell a missing rule from a
        # deliberately-ignored one.
        - match: {type: "assistant"}
          as: step
          fields:
            turn: "message.id"
        - match: {type: "user"}
          as: step
          fields: {}
        - match: {type: "system"}
          as: step
          fields: {}
        # Claude reports live rate-limit state in-band. Classified now; a future
        # budget adapter can read rate_limit_info from the raw payload rather
        # than the cached ~/.claude.json.
        - match: {type: "rate_limit_event"}
          as: step
          fields: {}
        # A heartbeat printed every 30s while one tool call (Bash, typically)
        # is still running — added to the CLI after this file's other progress
        # rules were written, so it fell through to `raw` unclassified. It
        # carries no message id (it is not part of any turn), same as
        # system/user/rate_limit_event above.
        - match: {type: "tool_progress"}
          as: step
          fields: {}

  # Codex CLI. Unlike the other three, `bin` is never invoked directly: the
  # runner execs `adapter` (CX-C1) in its place, told the real binary's
  # resolved path through MULTIAGENTS_BIN (CX-C2). The adapter owns the whole
  # native-CLI contract — profile selection, MCP config rendering, event
  # normalisation, auth/quota reads — because Codex's `exec --json` stream and
  # its `app-server` JSON-RPC protocol need more than declarative rules can
  # express. See providers/codex.py and providers/README.md.
  codex:
    handover_mode: {docker: copy, local: copy}
    # QH-R8: the adapter selects this private profile per account. Transfer
    # only its matching rollout; Codex repairs its own index on resume.
    session_store:
      profile_env: MULTIAGENTS_CODEX_PROFILE
      profile_default: "~/.multiagents/profiles/codex"
      dir: sessions
      glob: "**/rollout-*{session_id}.jsonl"
      forbidden_profile: "~/.codex"
    # NC-R32: enable only after session preservation is verified on the CLI.
    session_model_change: false
    bin: codex
    adapter: codex.py
    family: codex
    # codex-cli ships one binary per release under a versioned path; the
    # container mounts that root rather than the single resolved file.
    bin_versions_depth: 3
    notes: >
      Headless via `codex exec --json`, one JSON object per line. No
      `models_cmd`: Codex has none, so the adapter's own `models` action reads
      a locally-cached model list instead (CX-C12). No `transcript`: sessions
      live under a profile the adapter picks per run (CX-C8), not a fixed,
      guessable path. No `home_links`: linking the user's own ~/.codex would
      hand every agent ChatGPT's own OAuth token and every prior conversation
      (CX-D3) — the adapter instead resolves a private profile, created 0700,
      per CX-C8/C9.
    agent_guidance: >
      Your shell tool runs one command per call and does not itself impose a
      timeout on long-running commands (a test suite, a build). Wait for a
      command to finish before ending your turn, and never report a result
      you have not actually seen.
    spawn:
      prompt_transport: file
      args: ["run", "--prompt-file", "{prompt_file}", "--model", "{model}", "--workdir", "{workdir}"]
      resume: ["--session", "{session_id}"]
      permission:
        full: ["--permission", "full"]
        sandbox: ["--permission", "sandbox"]
        readonly: ["--permission", "readonly"]
      optional:
        effort: ["--effort", "{effort}"]
    # The multiagents server for an agent with spawn rights. Codex has no
    # config-file flag of its own for MCP servers (they live in `-c
    # mcp_servers=...`, which the adapter renders itself from this file after
    # first enumerating and explicitly disabling every OTHER server codex
    # already knows about); `file` only hands the adapter the one entry to add.
    mcp:
      file: mcp.json
      config:
        mcpServers:
          multiagents:
            command: "{mcp_command}"
            args: "{mcp_args}"
            env: "{mcp_env}"
      args: ["--mcp-config", "{mcp_config}"]
    # Codex reports per-turn deltas (turn.completed.usage), not a running
    # total, so they must be summed rather than taken at their maximum.
    usage_mode: delta
    models_parse: tsv
    # Paid through the ChatGPT subscription, not per-token.
    billing: plan
    # RC-R1 (bug-1213a0): the content-safety filter. Text the CLI prints when
    # it declines the PROMPT rather than doing the work — matched against the
    # final answer (fullmatch) and, for a run that exited non-zero, against
    # stderr (search), case-insensitively either way. A refusal says the
    # binary started, authenticated and answered; it is never a startup
    # failure (RC-R3).
    refusal_markers:
      - "This content was flagged for possible .* risk.*"
    # Q5 (doom-loop false positive on codex file_change): codex reports each
    # file edit as a `file_change` item, normalised to a tool event whose args
    # carry only the changed paths and kinds — never the content. Successive
    # edits to one file therefore normalise to identical name-and-args
    # signatures, and doom_loop used to trip on a working agent mid-edit. The
    # one field that would tell two edits apart (the item id) is dropped by
    # design (CX-C26: only the event shape is carried, never the raw object),
    # and the remaining args cannot distinguish one edit from another, so the
    # tool is declared opaque whole — the same reasoning as agy's view_file
    # (SL-R6) rather than agy's arg-scoped manage_task rule (bug-8615db):
    # there is no argument value that separates a legitimate call from a
    # repeated one. `command_execution` and `web_search` are deliberately NOT
    # declared: their args carry the command and the query, so a genuinely
    # repeated call still trips.
    opaque_tools:
      - file_change
    # Under docker, do NOT mount the host's ~/.codex: its OAuth token does not
    # survive containerisation any better than agy's, and a shared mount would
    # let a compromised agent read or rotate the host's own credential. A
    # private ~/.codex is mounted instead — see `multiagents docker login
    # codex` and CX-C8's run_profile().
    container_private_home:
      - ".codex"
    stream:
      format: ndjson
      session_id_paths: ["session_id"]
      # The adapter (Normalizer.event, in codex.py) does all real translation
      # from Codex's own event shapes; these rules are a pure passthrough of
      # its already-normalised field names.
      rules:
        - match: {kind: "text"}
          as: text
          fields: {text: "text", turn: "turn", block: "block"}
        - match: {kind: "tool"}
          as: tool
          fields: {name: "name", args: "args", state: "state", turn: "turn"}
        - match: {kind: "result"}
          as: result
          fields: {status: "status", text: "text", tokens: "tokens", turn: "turn"}
        - match: {kind: "error"}
          as: error
          fields: {text: "text", turn: "turn"}
        - match: {kind: "step"}
          as: step
          fields: {state: "state", turn: "turn"}

  # ---------------------------------------------------------------------
  # Template for a new integration. Uncomment, fill in, then verify with
  #   multiagents probe <name>
  # which runs a trivial task and reports which rules matched what.
  # ---------------------------------------------------------------------
  #
  # myclie:
  #   bin: myclie
  #   spawn:
  #     args: ["--headless", "{prompt}", "--model", "{model}"]
  #     resume: ["--session", "{session_id}"]
  #     permission:
  #       full: ["--yes"]
  #       sandbox: []
  #       readonly: []
  #   models_cmd: ["myclie", "list-models"]
  #   models_parse: lines          # lines | tsv
  #   home_links: [".config/myclie"]
  #   stream:
  #     format: ndjson             # ndjson | text
  #     session_id_paths: ["session"]
  #     rules:
  #       - match: {kind: "assistant"}
  #         as: text
  #         fields: {text: "message.content"}
  #       - match: {kind: "tool_call"}
  #         as: tool
  #         fields: {name: "tool.name", args: "tool.arguments"}

  # ---------------------------------------------------------------------
  # A SECOND ACCOUNT ON THE SAME CLI
  #
  # Two subscriptions are two providers: same binary, same script, same
  # parsing, different credentials. `extends` copies the integration so this is
  # four lines rather than a duplicated block, and `family` says the two share a
  # MODEL NAMESPACE — which is what makes failover between them free. `opus`
  # means the same thing on both accounts, so no agent needs a `models:` entry
  # to move from one to the other.
  #
  # `env` is what actually separates them, and it is applied to every action as
  # well as to every agent run. Measured on this machine rather than assumed:
  # CLAUDE_CONFIG_DIR relocates claude's whole state — credentials, config,
  # transcripts, even the daemon lock — and XDG_DATA_HOME does the same for
  # opencode. agy is the exception: its host credential lives in the GNOME
  # keyring, which no environment variable moves, so a second agy account needs
  # a container profile of its own instead.
  #
  # Then: `multiagents auth login claude-b`, which signs that profile in with
  # your own browser, and the roster needs no change at all — the agents' pins
  # choose the family, and the router chooses which account runs the work.
  #
  # claude-b:
  #   extends: claude
  #   container_account: b
  #   env:
  #     CLAUDE_CONFIG_DIR: "~/.multiagents/profiles/claude-b"
  #   # Local uses this relocated profile. Docker uses account b in claude's
  #   # host-only vault, drops CLAUDE_CONFIG_DIR at launch, and gives the CLI
  #   # the canonical writable profile with a sidecar placeholder. Log in with
  #   # `multiagents docker login claude-b`; the unpinned pool excludes b.
  #
  # opencode-b:
  #   extends: opencode
  #   env:
  #     XDG_DATA_HOME: "~/.multiagents/profiles/opencode-b/share"
  #     XDG_CONFIG_HOME: "~/.multiagents/profiles/opencode-b/config"
  #
  # codex-b:
  #   extends: codex
  #   family: codex
  #   container_private_home: [".codex-b"]
  #   # Docker login, runs and budget use this account's own private home.
  #   # Sign in with `multiagents docker login codex-b`. The executable stays
  #   # in codex's read-only versions root; .codex-b remains writable.
  #
  # `family` is what makes the two INTERCHANGEABLE, and that is a choice. Two
  # accounts you keep apart on purpose — work and personal, two clients, two
  # billing lines — should not be interchangeable, and saying so is one line:
  #
  # claude-personal:
  #   extends: claude
  #   family: claude-personal        # its own family of one: never failed over to
  #   env: {CLAUDE_CONFIG_DIR: "~/.multiagents/profiles/personal"}
  #
  # What the router then does, in the owner's words and in this order:
  #   * an agent pinned to the orchestrator's account runs on the OTHER one
  #     while it can, so the orchestrator keeps a window to read results in;
  #   * among the other accounts it picks the least busy, counted from the tree
  #     so every agent process ranks them the same way — never "the most
  #     headroom", which is a stale percentage that pins ten spawns to one
  #     account and annihilates it before the next reading;
  #   * if they are all full but one comes back within
  #     `budget.wait_for_reset_seconds`, the work WAITS rather than moving;
  #   * only a long exhaustion sends work to the orchestrator's account, and
  #     even then only while that account is above `budget.reserve_headroom`.
