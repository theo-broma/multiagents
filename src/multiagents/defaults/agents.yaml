# The roster. Each agent is a name bound to a CLI, a model, and an instruction
# file in agents/. Edit freely — this file is yours once `multiagents init` has
# copied it into the project.
#
# Keys
#   provider     which block in providers.yaml drives it
#   model        must exist in models.yaml (refresh with `multiagents refresh-models`)
#   instructions .md file under agents/, resolved project-first then global
#   models       per-provider fallback, used when `provider` is exhausted
#   writes       true  -> gets its own git worktree and branch
#                false -> runs read-only against the project directory
#   permission   full | sandbox | readonly   (see providers.yaml for caveats)
#   can_spawn    may this agent delegate to subagents of its own
#   timeout      wall-clock seconds; silence_timeout is per-stream quiet time
#
# This file holds the DEFAULT TEAM — six roles, described in agents/README.md.
# Specialists that are not in it (specifier, reviewer, researcher, pentester,
# security-advisor, spec-adversary) live in agents/library/ with a paste-ready
# block each in agents/library/README.md. The initializer proposes the ones a
# project needs during `multiagents init-agent`; adding one is a paste.
#
# Model choices below are a deliberate spread across the CLIs so the whole
# system is exercised from day one. Retune once your subscription changes what
# is available — and see the note on checking pairs at the bottom before you do.

agents:

  # ---------------------------------------------------------------- phase 1 --
  # Shapes the project WITH you before any implementation starts. Launched by
  # `multiagents init-agent`, resumable by running that again — this stage is
  # expected to take several sessions. It writes BRIEF.md, fills context/, and
  # proposes the team and the model for each role into
  # .multiagents/proposals/agents.yaml for you to accept. It never edits this
  # file: an agent given the wrong model produces work that looks fine, so the
  # roster is the one decision a human stays in the loop for.
  initializer:
    provider: claude
    model: sonnet
    instructions: team/_initializer.md
    description: Shapes the project with you. Launched by `multiagents init-agent`.
    launch: true
    role: initializer
    can_spawn: true

  # ------------------------------------------------------------- phases 2, 6 --
  # The orchestrator. Unlike every other entry this one is LAUNCHED, not
  # spawned: `multiagents run` starts this CLI as an MCP client and it drives
  # everything else. Change the provider and model here to orchestrate with a
  # different CLI — nothing else in the system needs to know.
  #
  # It writes the interface contracts and it makes every delegation and
  # architectural decision. It does NOT write implementation code; its context
  # is the one resource here that cannot be replaced.
  orchestrator:
    provider: claude
    model: sonnet
    instructions: team/_orchestrator.md
    description: Drives the project. Launched by `multiagents run`.
    launch: true
    role: orchestrator
    can_spawn: true

  # The standing second opinion. Talked to with consult(), which blocks for a
  # reply and keeps context between calls, so a driver can hold an actual
  # back-and-forth instead of firing off amnesiac one-shot questions. It
  # decides nothing and executes nothing.
  #
  # Only the two drivers can reach it — consult() needs spawn rights, which the
  # workers do not have. A worker that wants advice stops with NEED_INFO and
  # the orchestrator relays.
  #
  # Deliberately NOT a Claude model: feedback from the same family as the
  # orchestrator tends to agree with it, which defeats the purpose.
  advisor:
    provider: agy
    model: gemini-3.1-pro-high
    instructions: team/advisor.md
    models:
      opencode: opencode-go/deepseek-v4-pro
    description: Consultative second opinion. Advises; decides and executes nothing.
    conversational: true
    writes: false
    permission: readonly
    effort: high
    can_spawn: false
    timeout: 420
    silence_timeout: 180

  # ---------------------------------------------------------------- phase 3 --
  # Writes the black-box behavioural suite from the orchestrator's contract,
  # BEFORE any implementation exists. Red is the correct outcome of its run.
  #
  # On a strong model rather than a fast one, unlike earlier versions of this
  # roster: the job is no longer "iterate until green" but "decide what done
  # means", and an exhaustive edge-case suite written against an interface that
  # does not exist yet is the most consequential writing in the pipeline. A
  # cheap test engineer is how a project ends up with a green suite that
  # asserts the happy path and nothing else.
  tester:
    provider: agy
    model: gemini-3.1-pro-high
    instructions: team/tester.md
    models:
      opencode: opencode-go/gpt-5.6-luna
    description: >-
      Writes the black-box behavioural test suite that defines done, before the
      implementation exists. Red is success.
    writes: true
    permission: sandbox
    effort: high
    can_spawn: false
    timeout: 1500
    silence_timeout: 240

  # ---------------------------------------------------------------- phase 4 --
  # Three coder tiers sharing one brief. They differ in what they cost and how
  # much judgement the task needs — NOT in how important the feature is, which
  # is the tempting and wrong way to route (it sends everything to the top
  # tier). The routing rule and the escalation path live in the orchestrator's
  # brief; without them a tiered roster just becomes an expensive one.
  #
  # All three have read-only access to the test suite by instruction: a suite
  # the implementer can edit is not a contract, it is a suggestion.
  #
  # The model pins are a starting point, not a ranking anyone has measured
  # here. Retune them for your own work: what the tiers give you is the
  # routing and the escalation, and those survive any repin.

  # Mechanical work that is already decided: a named change, an existing
  # pattern to follow, or a failing test that defines done. Short leash — a
  # low max_steps so a task that turns out to need thinking stops cheaply
  # instead of flailing at 120 steps.
  implementer-quick:
    provider: opencode
    model: opencode-go/glm-5.3-flash
    instructions: team/implementer.md
    models:
      agy: gemini-3.8-flash-medium
    description: >-
      Cheap coder for well-specified mechanical changes. Escalates rather than
      guessing when a task needs a design decision.
    writes: true
    permission: full
    can_spawn: false
    timeout: 900
    silence_timeout: 180
    # 40 is low ON PURPOSE, and it is not a ceiling: a runaway_steps trip marks
    # the run `stuck` and reports it — it never kills — so for this tier the
    # number is an ESCALATION signal, not a limit. "This cheap agent has taken
    # more than forty steps" is exactly when the parent should consider a
    # stronger one.
    #
    # Worth knowing when tuning it: on one real project the implementers'
    # successful runs had a median of 71 steps and a p90 of 176. So this trips
    # on ordinary work by design, and if you want it to mean "runaway" rather
    # than "escalate", it belongs nearer those numbers.
    max_steps: 40

  implementer:
    provider: opencode
    model: opencode-go/kimi-k2.7-code
    instructions: team/implementer.md
    models:
      agy: claude-sonnet-4-6
    description: Writes code on its own branch. The workhorse, and the default.
    writes: true
    permission: full
    can_spawn: true
    max_children: 2
    timeout: 1800
    silence_timeout: 240
    # Measured: real runs of this reach 700-800 steps.
    max_steps: 1000

  # Work where the difficulty is in deciding, not typing: an invariant, a
  # cross-cutting change, concurrency, a data migration, or a task a lower tier
  # handed back. Expensive per run, so the orchestrator is told to spend it on
  # judgement rather than on importance.
  implementer-deep:
    provider: opencode
    model: opencode-go/kimi-k3
    instructions: team/implementer.md
    models:
      # A fallback may say what this agent BECOMES elsewhere, not just which
      # model. `effort` belongs to a provider's namespace as much as a model id
      # does: this one carries effort: high, and agy refuses that flag for this
      # model — "--effort is not supported for model claude-opus-4-6-thinking",
      # in eight seconds, on a real run. Naming it empty drops the flag.
      agy:
        model: claude-opus-4-6-thinking
        effort: ""
    description: >-
      Strong coder for work that needs design judgement, or that a lower tier
      escalated. Expensive; used deliberately.
    writes: true
    permission: full
    effort: high
    can_spawn: true
    max_children: 2
    timeout: 2700
    silence_timeout: 300
    # Measured: real runs of this reach 700-800 steps.
    max_steps: 1000

  # ---------------------------------------------------------------- phase 5 --
  # Attacks code that already passes its tests: mutation testing, fuzzing,
  # inputs the suite never uses, interleaving, and the attacker's position on
  # anything reachable from outside. It commits tests that fail now and fixes
  # nothing.
  #
  # It checks BOTH the implementer's code and — through mutation — the
  # coverage of the tester's suite, so it is pinned away from both of them. An
  # attacker that shares the author's blind spots agrees with them, which is
  # the one thing it must not do.
  #
  # A strong-reasoning pick, and yours to change; the family difference is the
  # part that matters. This model previously carried the `pentester` brief,
  # whose attacker-position work this role absorbed.
  adversary:
    provider: opencode
    model: opencode-go/deepseek-v4-pro
    instructions: team/adversary.md
    models:
      agy: gemini-3.8-flash-high
    description: >-
      Attacks green code with mutation, fuzzing and untested inputs. Commits
      failing tests that prove findings; proposes no fixes.
    writes: true
    permission: sandbox
    effort: high
    can_spawn: false
    timeout: 1500
    silence_timeout: 240

  # ------------------------------------------------------------ infrastructure
  # Writes up defects in multiagents ITSELF — not bugs in your project, which
  # are ordinary work for the implementer. Not part of the six-phase pipeline.
  # Read-only and cheap: its product is one ticket, and the runner gives it the
  # environment block so it does not have to discover (or invent) facts about
  # the machine it runs on.
  bug-reporter:
    provider: opencode
    model: opencode-go/glm-5.3-flash
    role: bug-reporter
    instructions: bug-reporter.md
    models:
      agy: gemini-3.8-flash-medium
    description: >-
      Writes a publishable ticket for a bug in multiagents itself, with no
      personal or sensitive information in it. Can propose a fix.
    writes: false
    permission: readonly
    can_spawn: false
    timeout: 420
    silence_timeout: 180

  # -------------------------------------------------------------- deprecated --
  # deep_merge can only add and override, never delete, so an install that
  # already carries these keeps them unless they are shipped explicitly
  # disabled.

  # Folded into `advisor`, which is the same role without a model family in its
  # name. Its brief is now agents/team/advisor.md.
  critic:
    disabled: true
    provider: opencode
    model: opencode-go/gpt-5.6-luna
    description: Deprecated. Use `advisor`.

  gemini:
    disabled: true
    provider: agy
    model: gemini-3.1-pro-high
    description: Deprecated alias for `advisor`.

# ---------------------------------------------------------------------------
# Checking pairs, if you repin
#
# Three of these agents check each other's work, and a checker sharing the
# author's blind spots agrees with it — silently, at the moment nobody is
# watching. `tester`, the `implementer` tiers and `adversary` must land on
# DIFFERENT models, and must still do so after a failover: the `models:`
# fallbacks above are chosen so that with either provider down, no two of them
# collapse onto the same model. Check that again if you change a pin.
