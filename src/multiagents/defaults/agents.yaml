# The roster. Each agent is a name bound to a CLI, a model, and an instruction
# file in agents/. Edit freely — this file is yours once `multiagents init` has
# copied it into the project.
#
# Keys
#   provider     which block in providers.yaml drives it
#   model        must exist in models.yaml (refresh with `multiagents refresh-models`)
#   instructions .md file in agents/, resolved project-first then global
#   writes       true  -> gets its own git worktree and branch
#                false -> runs read-only against the project directory
#   permission   full | sandbox | readonly   (see providers.yaml for caveats)
#   can_spawn    may this agent delegate to subagents of its own
#   timeout      wall-clock seconds; silence_timeout is per-stream quiet time
#
# Model choices below are a deliberate spread across both CLIs so the whole
# system is exercised from day one. Retune once your opencode subscription
# changes what is available.

agents:

  # Shapes the project WITH you before any implementation starts. Launched by
  # `multiagents init-agent`, resumable by running that again — this stage is
  # expected to take several sessions. It writes BRIEF.md and fills context/,
  # and can consult the critic and advisor while it works.
  initializer:
    provider: claude
    model: sonnet
    instructions: _initializer.md
    description: Shapes the project with you. Launched by `multiagents init-agent`.
    launch: true
    role: initializer
    can_spawn: true

  # The orchestrator. Unlike every other entry this one is LAUNCHED, not
  # spawned: `multiagents run` starts this CLI as an MCP client and it drives
  # everything else. Change the provider and model here to orchestrate with a
  # different CLI — nothing else in the system needs to know.
  orchestrator:
    provider: claude
    model: sonnet
    instructions: _orchestrator.md
    description: Drives the project. Launched by `multiagents run`.
    launch: true
    role: orchestrator
    can_spawn: true


  researcher:
    provider: opencode
    model: opencode-go/glm-5.3-flash
    instructions: researcher.md
    description: Reads the codebase and answers questions. No writes.
    writes: false
    permission: readonly
    can_spawn: false
    timeout: 600
    silence_timeout: 120

  # Writes the numbered requirements a feature is built against. No code.
  # A broad prompt gets the median implementation because "build the checkout"
  # does not say what better means; this is what makes better sayable.
  specifier:
    provider: agy
    model: gemini-3.1-pro-high
    instructions: specifier.md
    description: >-
      Turns an intention into numbered, individually testable requirements in
      context/specs/<feature>.md. Writes no code.
    writes: true
    permission: sandbox
    effort: high
    can_spawn: false
    timeout: 1200
    silence_timeout: 240

  # Attacks a specification before anything is built. Deliberately on a
  # DIFFERENT model family from the specifier: an adversary that shares the
  # author's blind spots agrees with it, which is the one thing it must not do.
  adversary:
    provider: opencode
    model: opencode-go/gpt-5.6-luna
    instructions: adversary.md
    description: >-
      Attacks a spec with concrete failure scenarios before implementation.
      Appends them to the spec file; proposes no fixes.
    writes: true
    permission: sandbox
    effort: high
    can_spawn: false
    timeout: 1200
    silence_timeout: 240

  implementer:
    provider: opencode
    model: opencode-go/kimi-k2.7-code
    instructions: implementer.md
    description: Writes code on its own branch. The workhorse.
    writes: true
    permission: full
    can_spawn: true
    max_children: 2
    timeout: 1800
    silence_timeout: 240

  reviewer:
    provider: agy
    model: gemini-3.1-pro-high
    instructions: reviewer.md
    description: Reviews a diff for correctness and reports findings. No writes.
    writes: false
    permission: readonly
    effort: high
    can_spawn: false
    timeout: 900
    silence_timeout: 180

  # Attacks written code from an attacker's position. Not the reviewer, which
  # asks whether the code is correct; this asks what someone gets when they try
  # to break it. On a different provider from security-advisor on purpose: the
  # audit should not be done by whoever blessed the design. The specific model
  # is a strong-reasoning pick and yours to change — the family difference is
  # the part that matters.
  pentester:
    provider: opencode
    model: opencode-go/deepseek-v4-pro
    instructions: pentester.md
    description: >-
      Attacks existing code for exploitable paths and reports position, path and
      outcome. May commit a failing test that proves a finding.
    writes: true
    permission: sandbox
    effort: high
    can_spawn: false
    timeout: 1500
    silence_timeout: 240

  tester:
    provider: agy
    model: gemini-3.8-flash-medium
    instructions: tester.md
    description: Writes and runs tests, iterating until green. Fast loop.
    writes: true
    permission: sandbox
    effort: medium
    can_spawn: false
    timeout: 1200
    silence_timeout: 180

  # A standing advisor rather than a task runner. Talked to with consult(),
  # which blocks for a reply and keeps context between calls, so the
  # orchestrator can hold an actual back-and-forth instead of firing off
  # amnesiac one-shot questions.
  #
  # Deliberately NOT a Claude model: feedback from the same family as the
  # orchestrator tends to agree with it, which defeats the purpose.
  critic:
    provider: opencode
    model: opencode-go/gpt-5.6-luna
    instructions: critic.md
    description: Critical thinker. Advises the orchestrator; decides nothing.
    conversational: true
    writes: false
    permission: readonly
    can_spawn: false
    timeout: 300
    silence_timeout: 120

  # Consulted while something is still being designed, when a boundary can
  # still be moved for free. Conversational for the same reason the critic is:
  # a threat model is built through follow-ups, not one-shot questions.
  security-advisor:
    provider: agy
    model: gemini-3.1-pro-high
    instructions: security-advisor.md
    description: >-
      Design-time security advice, phrased as candidate requirements the
      specifier can absorb. Advises; decides nothing.
    conversational: true
    writes: false
    permission: readonly
    effort: high
    can_spawn: false
    timeout: 420
    silence_timeout: 180

  # A second standing advisor, on Gemini rather than the critic's GPT model.
  # Useful when you want a genuinely different perspective on the same
  # question, or a long technical discussion with a large-context model.
  advisor:
    provider: agy
    model: gemini-3.1-pro-high
    instructions: critic.md
    description: Conversational advisor on Gemini 3.1 Pro. Advises; decides nothing.
    conversational: true
    writes: false
    permission: readonly
    effort: high
    can_spawn: false
    timeout: 420
    silence_timeout: 180

  # Writes up defects in multiagents ITSELF — not bugs in your project, which
  # are ordinary work for the implementer. Read-only and cheap: its product is
  # one ticket, and the runner gives it the environment block so it does not
  # have to discover (or invent) facts about the machine it runs on.
  bug-reporter:
    provider: opencode
    model: opencode-go/glm-5.3-flash
    role: bug-reporter
    instructions: bug-reporter.md
    description: >-
      Writes a publishable ticket for a bug in multiagents itself, with no
      personal or sensitive information in it. Can propose a fix.
    writes: false
    permission: readonly
    can_spawn: false
    timeout: 420
    silence_timeout: 180

  # Renamed to `advisor` so it is not bound to one model family. deep_merge can
  # only add and override, never delete, so an install that already carries a
  # `gemini` entry keeps it unless it is shipped explicitly disabled.
  gemini:
    disabled: true
    provider: agy
    model: gemini-3.1-pro-high
    description: Deprecated alias for `advisor`.
