# Project-wide policy. Copied into <project>/.multiagents/config/ by
# `multiagents init`, where you can edit it without touching the global copy.

# --------------------------------------------------------------------------
# Where agent processes run.
#   local   subprocess on this machine, isolated by git worktree + per-agent HOME
#   docker  one container per project, agents get full powers inside it
# The two backends sit behind the same interface, so switching is this one key.
# --------------------------------------------------------------------------
executor:
  kind: local

  docker:
    # One long-lived container per project; agents enter it with `docker exec`.
    # Build with `multiagents docker build`, then switch kind to `docker`.
    image: multiagents/workspace:latest
    proxy_image: multiagents/proxy:latest

    # Resource ceilings. These are the hard cap on runaway recursion that the
    # local executor cannot give you.
    cpus: "2"
    memory: "4g"
    pids_limit: 512

    # Agent CLIs and their credential directories are bind-mounted from the
    # host rather than baked into the image, so they keep self-updating on the
    # host. The list of credential paths comes from each provider's home_links
    # in providers.yaml, so it cannot drift from what a per-agent HOME expects.
    mount_cli_from_host: true

    # Anything else agents need visible. Mounted at the identical host path.
    extra_mounts: []
    #  - path: ~/.cache/uv
    #  - path: /opt/toolchain
    #    read_only: true

    # allowlist  agents sit on an internal network with NO route out and reach
    #            the world only through a filtering proxy — so a credential an
    #            agent can read is one it still cannot post anywhere
    # bridge     ordinary docker networking, unrestricted egress
    # none       no network at all
    network: allowlist
    #
    # Patterns are anchored, so "example.com" permits api.example.com but not
    # evil-example.com. Three groups, and the trade differs for each:
    egress_allowlist:
      # 1. Model endpoints. Without these no agent can run at all.
      - opencode.ai
      - googleapis.com
      - google.com
      - api.anthropic.com
      - antigravity.google
      - googleusercontent.com
      - gstatic.com

      # 2. Package registries and docs. Without these an agent cannot install a
      # dependency or look anything up, and will thrash trying — an isolated
      # agent that cannot build is not safer, just useless. Trim this group if
      # your project vendors its dependencies.
      - pypi.org
      - files.pythonhosted.org
      - registry.npmjs.org
      - crates.io
      - static.crates.io
      - proxy.golang.org
      - sum.golang.org
      - deb.debian.org
      - archive.ubuntu.com
      - security.ubuntu.com
      - docs.python.org
      - developer.mozilla.org

      # 3. Source hosting. Needed to clone and to read issues. This is the one
      # group that could carry data OUT as well as in — but agents hold no
      # git credentials (GITHUB_TOKEN and GH_TOKEN are in env_block, and
      # SSH_AUTH_SOCK is never forwarded), so a push has nothing to
      # authenticate with. Remove it if that is not a trade you want.
      - github.com
      - raw.githubusercontent.com
      - codeload.github.com
      - objects.githubusercontent.com

    # Where a provider's container-private credentials live.
    #   shared   one login per machine, reused by every project (default)
    #   project  a separate login per project, if you want separate accounts
    credential_scope: shared

    # Never enabled. Docker here is rootful and the user is in the `docker`
    # group, so the socket is host root — an agent holding it escapes the
    # container in one command. Setting this true is refused, not honoured.
    mount_docker_socket: false

# --------------------------------------------------------------------------
# Git. The parent owns every branch: it creates the worktree, merges the
# result, and deletes the branch. Subagents commit, and do nothing else.
# --------------------------------------------------------------------------
git:
  # Empty means local commits only — nothing ever leaves this machine.
  remote: ""
  # Empty means: branch from whatever HEAD is at spawn time.
  base_branch: ""
  branch_prefix: "agents"
  # Even with a remote set, agent branches are not pushed by default; pushing
  # is an explicit parent action, not a side effect of finishing.
  push_agent_branches: false

  merge:
    # An agent squash-merges its own children without asking: their work is
    # still quarantined on its branch, so nothing real has changed yet.
    inside_tree: auto
    # Landing on your base branch is always an explicit merge_agent() call.
    into_base: explicit
    style: squash        # squash | no-ff

# --------------------------------------------------------------------------
# What a child process is allowed to see.
# --------------------------------------------------------------------------
security:
  # Environment variables passed through to agents.
  #
  # Empty, as intended: every CLI authenticates with credentials it already
  # stores under its own HOME, so no secret transits the environment at all.
  # opencode Go authenticates through its own auth.json credential, which the
  # per-agent HOME links in — DEEPINFRA_API_KEY is no longer needed and is
  # blocked below.
  env_passthrough: []

  # Never forwarded, and their values are registered as redaction literals so
  # they are masked if they surface in output by another route.
  # SSH_AUTH_SOCK matters most: it is the one credential that is not a readable
  # file, and withholding it genuinely prevents an agent pushing as you.
  env_block:
    - SSH_AUTH_SOCK
    - SSH_AGENT_PID
    - TAVILY_API_KEY
    - CLAUDE_CODE_MESSAGING_TOKEN
    - ANTHROPIC_API_KEY
    - ANTHROPIC_AUTH_TOKEN
    - DEEPINFRA_API_KEY
    - GITHUB_TOKEN
    - GH_TOKEN

  # per-agent  each agent gets HOME=~/.multiagents/homes/<project>/<id> with
  #            only its own provider's state linked in, so an opencode agent
  #            cannot read Claude's or agy's stored tokens
  # shared     agents use your real HOME; zero compatibility risk, no isolation
  home_policy: per-agent

# --------------------------------------------------------------------------
# Ceilings. Recursion makes these mandatory rather than advisory: an agent that
# can spawn agents that can spawn agents is an exponential with a credit card.
# --------------------------------------------------------------------------
limits:
  max_depth: 3              # root orchestrator is depth 0
  max_children: 2           # per node, unless the agent overrides it
  max_concurrent: 4         # running agents across the whole tree
  default_timeout: 900      # wall-clock seconds per run
  silence_timeout: 180      # seconds with no stream event before "stuck"
  # Steps before a run is called runaway. An agent may override it; 120 was
  # calibrated on short test runs and fired 27 times in one real session, on
  # work that was finishing correctly. Measured there: specifier and adversary
  # peak under 30, tester at 86, reviewer and critic under 80, a conversational
  # advisor at 101 — while coders reached 768. So the ceiling belongs above the
  # reviewers and the coders carry their own.
  max_steps: 250
  # Identical tool+args calls before "stuck". Raised from 3: the check also
  # requires the working tree to have stood still, so a higher bar costs little
  # and 3 was firing on ordinary iteration.
  doom_loop_repeats: 5
  budget_tokens: 0          # 0 = unlimited; otherwise tree-wide ceiling

  # `start_agent(workdir=...)` puts an agent in a directory of its choosing
  # instead of its own worktree — no branch, no isolation from siblings, and
  # nothing to discard if the run goes wrong. It is an MCP parameter, so the
  # caller asking for it is a MODEL: a scary flag name deters people, not
  # samplers. The permission therefore lives here, where a human grants it by
  # editing a file, and an agent cannot grant it to itself.
  allow_workdir_override: false

  # When the orchestrator ends for a reason that was not you — a crash, or a
  # terminal that went away — `run` waits and starts it again, interactively,
  # with an opening message asking it to take stock. Interactive on purpose:
  # a session you can see is one you can stop, which is what makes retrying an
  # unknown state reasonable at all. With no terminal left to write to it falls
  # through to the headless loop instead.
  restart_attempts: 5
  restart_delay_seconds: 60
  # A lost terminal is always retried; a CRASH is not, unless you say so. By
  # the time an error reaches the process boundary the CLI has exhausted its own
  # retries, so whatever produced it is still there and a restart reads it
  # again. "Only retry if it ran a while first" does not save you either: a
  # context-length overrun takes minutes to arrive and then repeats exactly.
  restart_on_crash: false
  # Applies only when the above is on: even then, a failure faster than this is
  # the same fault being read again.
  restart_min_runtime_seconds: 60

  # A usage limit never reaches the exit code. The CLI prints it into the chat
  # log and stays at the prompt, alive and idle, so every restart path — all of
  # which key on the process ENDING — waits for something that will not happen.
  # The parent therefore watches for the CLI's own hardcoded message (see
  # providers.yaml `limit_markers`) and ends the session itself. This is the
  # one place a transcript is read for a signal: those strings are written by
  # the CLI's error handler, not by a model.
  #
  # A window that resets is waited out this long, then the session is started
  # again to find out. The wait grows across consecutive limits (x1 x2 x3 x4,
  # capped) because a window that has not reopened in fifteen minutes is not
  # about to.
  limit_wait_seconds: 900
  # How many such waits before giving up. Waiting is NOT one of the restart
  # attempts above and does not spend them: the window on claude is FIVE HOURS,
  # and five tries backing off from a minute would give up halfway through it
  # having proved only that the limit was still there. Twelve waits reach past
  # ten hours.
  limit_max_waits: 12
  # Read the account's real usage from the provider, rather than only from
  # whatever cache its CLI happened to leave on disk. It is the same request
  # that CLI makes, with the same token, at most once every five minutes per
  # machine and only when something actually asks — but the endpoint is not a
  # documented one, and the thing at risk if that is ever judged unwelcome is
  # YOUR account, not this project's. So it is a switch. Turned off, quota
  # readings fall back to the CLI's cache and go quiet when it does.
  ask_provider_for_usage: true
  # For a limit KNOWN not to reset — a dead account rather than a spent window.
  # Nothing ships marked that way: the provider's own wording does not reliably
  # tell the two apart (see providers.yaml `limit_markers`), and this is the
  # expensive mistake to make, since a wall wrongly assumed costs an afternoon
  # of doing nothing. The hold is only how long the reason stays on record;
  # launching the role by hand lifts it.
  spend_limit_pause_hours: 12

  # How long a provider is cooled down when its own `check` action says it is
  # not authenticated. Long, because that fault does not heal by itself: only a
  # person logging in fixes it, and retrying every half hour spends real agent
  # runs proving something already known. Recovery does not wait for the timer
  # — the next spawn re-runs `check`, and a pass clears the cooldown at once.
  provider_auth_cooldown_seconds: 21600
  # How often that `check` may be re-run while a provider is locked out, and
  # how long a single retry is reserved to one task when a cooldown lapses.
  # Short, because it is what decides how quickly logging back in takes effect.
  provider_probe_seconds: 120

  # How long the OTHER accounts on a CLI are paused when two of them fail at
  # once. Short on purpose: that is an inference about the vendor drawn from a
  # coincidence, not an observed penalty like a quota wall, and inheriting the
  # observed duration would turn one account's fifty-hour limit plus another's
  # transient error into a multi-day lockout of a vendor that was never down.
  provider_family_cooldown_seconds: 300

  # Winding down, rather than hitting a wall.
  #
  # A provider's usage window is shared by every agent running against it, so
  # how fast it is draining is a GLOBAL fact — measured from the headroom
  # readings the router already takes, not from any one agent's consumption.
  # Measured on a real project: two opus agents refilled a fresh five-hour
  # window in thirteen minutes, were restarted the moment it reopened, and
  # filled it again.
  #
  # These are a COUNTDOWN, so the larger number happens first. Getting that
  # backwards is easy and was got backwards here first time: new work has to
  # stop BEFORE the running agents are asked to land, or they are writing their
  # handoffs while fresh work drains the same window underneath them.
  #
  # T-10min: no NEW work is routed to that provider. A run started here is one
  # that gets cut off mid-thought, and its context has to be paid for again.
  wind_down_seconds: 600
  # T-7min: the agents already running are asked ONCE to commit what works and
  # write a handoff — with three minutes of quiet ahead of them in which to do
  # it, because nothing new has been started since T-10.
  wrap_up_seconds: 420
  wind_down_poll_seconds: 60

  # Circuit breaker. A provider whose last few runs ALL failed is broken
  # whatever the reason, and that is knowable without reading what the agents
  # said — which is the signal this project learned not to classify on. Set
  # from a real incident: a revoked token let thirteen agents fail identically
  # before anyone noticed, and every one of them cost a spawn.
  # A run that dies with nothing to say, before it has done any work, is a
  # transient glitch far more often than a real fault — so it gets one silent
  # retry rather than making the orchestrator reason about infrastructure.
  # Bounded by cost: a run that died after twenty minutes had spent millions of
  # tokens, and spending them again is not absorbing a glitch. Set to 0 to
  # never retry.
  retry_silent_failure_under_seconds: 60

  provider_failure_threshold: 3
  provider_down_cooldown_seconds: 1800

# --------------------------------------------------------------------------
# Quota awareness. Used to route work away from a rationed provider and toward
# one with headroom, and to park tasks until a bucket resets.
# --------------------------------------------------------------------------
budget:
  # Keep this much of a provider's window unspent, so that a run does not end
  # with an orchestrator that cannot answer for the agents it started.
  reserve_headroom: 0.15
  # Whether that reserve applies to EVERY provider. Off, because it made a
  # worker provider unusable long before it was: opencode reports the worst of
  # its three windows, so at 86% of a WEEKLY window — with the five-hour window
  # it actually runs against sitting empty — headroom read 0.14, fell under the
  # reserve, and every agent silently moved to a fallback for the rest of the
  # week. Off means: use what you are paying for until it genuinely runs out.
  reserve: false
  # Whether it applies to the provider the ORCHESTRATOR runs on. On, because
  # that is the reserve's original and much narrower purpose: delegating work
  # to the same provider your orchestrator is spending can leave it with no
  # room to read the results, and an orchestrator that cannot finish a turn
  # stops the whole tree rather than one agent.
  reserve_orchestrator: true
  # When every account on an agent's own CLI is full but one of them comes back
  # within this long, the work WAITS instead of moving. Moving it means either
  # another vendor's model or — worse — the account being kept for the
  # orchestrator, and neither is worth doing to avoid a twenty-minute wait.
  wait_for_reset_seconds: 1800
  # Consulted in order when an agent's provider is exhausted or cooling down.
  fallback_chain:
    - opencode
    - agy
    - defer
  # How long to cool a provider down after a quota failure when we cannot read
  # a real reset time from it.
  blind_cooldown_seconds: 900

# --------------------------------------------------------------------------
# Reporting bugs in multiagents itself.
#
# When an agent hits a defect in the tooling, the orchestrator delegates to the
# `bug-reporter` agent, which writes a ticket. Tickets are depersonalised as
# they are stored — home directory, project path, username and hostname are
# replaced — so what you review is exactly what would be published.
#
# `automatic: false` means nothing leaves this machine without you: the ticket
# is queued and you submit it with `multiagents tickets submit <id>`. Set it to
# true only if you are content for issue text to be posted unread.
# --------------------------------------------------------------------------
bug_reporting:
  enabled: true
  automatic: false
  # Empty means tickets are written and kept local.
  repo: "theo-broma/multiagents"
  labels: []
