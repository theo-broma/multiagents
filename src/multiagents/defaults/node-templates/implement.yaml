template: implement
version: 1
params:
  spec_path: {type: string}
  tests_task: {type: text}
  implement_task: {type: text}
  tester: {type: agent}
  reviewer: {type: agent}
  implementer: {type: agent}
  test_rounds: {type: int, default: 2}
  impl_rounds: {type: int, default: 3}
root:
  key: implement
  kind: sequence
  children:
    - key: tests
      kind: loop
      verdict_child: tests_review
      max_rounds: {param: test_rounds}
      children:
        - {key: test_work, kind: simple, agent: {param: tester}, task: {param: tests_task}}
        - key: tests_review
          kind: simple
          agent: {param: reviewer}
          session: B
          spec_path: {param: spec_path}
          task: |
            Review the tests against the specification and give a verdict.

            You are this loop's verdict child, so call `give_verdict` over the
            RPC with the verdict you reached; the loop waits for that call and
            is held for a human without it. Also end your message with the
            verdict line, `VERDICT(approved): ...` or
            `VERDICT(rejected, 2): ...`, whatever the call said.
    - key: implementation
      kind: loop
      verdict_child: impl_review
      max_rounds: {param: impl_rounds}
      children:
        - {key: impl_work, kind: simple, agent: {param: implementer}, task: {param: implement_task}}
        - key: impl_review
          kind: simple
          agent: {param: reviewer}
          session: B
          spec_path: {param: spec_path}
          task: |
            Review the implementation against the specification and give a verdict.

            You are this loop's verdict child, so call `give_verdict` over the
            RPC with the verdict you reached; the loop waits for that call and
            is held for a human without it. Also end your message with the
            verdict line, `VERDICT(approved): ...` or
            `VERDICT(rejected, 2): ...`, whatever the call said.
