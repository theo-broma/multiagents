# Tests first, then implementation, each reviewed against the specification.
# Choose implement for the built-in review tasks and explicitly supplied roles.
# Choose implement-reviewed for custom reviews, default roles and spec references
# on every task; choose review-loop for a single deliverable.
#
# Parameters substitute whole values: {param: x} uses the value of x.
# There is no interpolation inside strings. Supply complete task texts; agent
# parameters name agents in the configured roster.
# register_template stores a scheduler-DB definition that overrides the shipped
# file of the same name. Registration needs a strictly higher version than the
# currently resolved definition; existing instances keep their definition.
#
# A loop runs its children in order: work, then the designated verdict_child.
# After successful review completion, approval ends the loop. Rejection increments
# rounds_rejected and relaunches both children for another round, attaching the
# reviewer's structured findings to the work child's prompt.
# max_rounds limits rejected rounds, including the first round. At the limit the
# loop is held as loop_max. The orchestrator decides: relaunch_node with a higher
# max_rounds to continue, or close_node with approved, failed or exhausted.
#
# The verdict_child judges the current work generation. It can call give_verdict
# with approved/rejected and structured findings, or write a final-text line:
# VERDICT(approved): ... or VERDICT(rejected, 2): ... . A text verdict counts only
# from a successfully finished reviewer run; contradictory text verdicts do not
# count. If both paths are used, the tool verdict wins and disagreement is recorded.
# Text-only rejection supplies no structured findings: neither prose nor the
# number in the verdict line populates the findings list.
# With neither verdict, the loop is held unresolved_round. relaunch_node then
# defaults to retrying only the verdict child; retry: round repeats both children.
#
# A real NEED_INFO(topic): question in a child's final response, with no verdict,
# holds the child as needs_info and its loop as child_held. The orchestrator answers
# and uses relaunch_node on the held child; the loop can then continue.
#
# session: B resumes the reviewer conversation across rounds. Today aliases are
# scoped to the template instance (instance ID plus alias), not globally: concurrent
# instances have separate B conversations. Within one instance, nodes sharing an
# alias share its conversation and serialize while it is busy.
#
# The top-level sequence runs tests before implementation; implementation waits
# for the tests loop to succeed. A held child holds the sequence; a failed child
# fails it. Both reviewers use B, so the implementation reviewer resumes the tests
# reviewer's conversation within this instance.
# When the top-level sequence is done/approved, call merge_node on that sequence's
# instance node ID to publish the combined result; children are not merge targets.
#
# spec_path is template-local: expansion appends "The specification is at
# `PATH`." to each task whose node declares spec_path. It never becomes a node
# field and does not read the specification file.
# The reference is appended to the two reviewer tasks only.
# The fixed review tasks below ask for both paths; a tool call is not required today.

template: implement
version: 1
params:
  # Specification path; required, no default.
  spec_path: {type: string}
  # Complete test-writing task; required, no default.
  tests_task: {type: text}
  # Complete implementation task; required, no default.
  implement_task: {type: text}
  # Test-writing agent; required, no default.
  tester: {type: agent}
  # Review agent; required, no default.
  reviewer: {type: agent}
  # Implementation agent; required, no default.
  implementer: {type: agent}
  # Maximum rejected test rounds; default 2, positive integer.
  test_rounds: {type: int, default: 2}
  # Maximum rejected implementation rounds; default 3, positive integer.
  impl_rounds: {type: int, default: 3}
root:
  key: implement
  kind: sequence
  children:
    - key: tests
      kind: loop
      verdict_child: tests_review
      max_rounds: {param: test_rounds}
      children:
        - {key: test_work, kind: simple, agent: {param: tester}, task: {param: tests_task}}
        - key: tests_review
          kind: simple
          agent: {param: reviewer}
          session: B
          spec_path: {param: spec_path}
          task: |
            Review the tests against the specification and give a verdict.

            You are this loop's verdict child, so call `give_verdict` over the
            RPC with the verdict you reached; the loop waits for that call and
            is held for a human without it. Also end your message with the
            verdict line, `VERDICT(approved): ...` or
            `VERDICT(rejected, 2): ...`, whatever the call said.
    - key: implementation
      kind: loop
      verdict_child: impl_review
      max_rounds: {param: impl_rounds}
      children:
        - {key: impl_work, kind: simple, agent: {param: implementer}, task: {param: implement_task}}
        - key: impl_review
          kind: simple
          agent: {param: reviewer}
          session: B
          spec_path: {param: spec_path}
          task: |
            Review the implementation against the specification and give a verdict.

            You are this loop's verdict child, so call `give_verdict` over the
            RPC with the verdict you reached; the loop waits for that call and
            is held for a human without it. Also end your message with the
            verdict line, `VERDICT(approved): ...` or
            `VERDICT(rejected, 2): ...`, whatever the call said.
