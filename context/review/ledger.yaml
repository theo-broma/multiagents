findings:
  F1:
    class: security
    context: context/review/C1-sandbox.md
    evidence: 'confirmed twice: (1) a standalone `re` simulation of the generated'
    first_seen: bfdc29317eebdef5ce71b0e084c295f897c9a8b5
    history:
    - by: auditor
      note: filed in context/review/C1-sandbox.md
      sha: bfdc29317eebdef5ce71b0e084c295f897c9a8b5
      status: open
    - by: initializer
      note: 'BRIEF.md phase 2, item 1 — covered by the F13 ERE-escaping rewrite. Kept
        as its own id rather than folded in: it is the critical one of the cluster
        and the fix must be verified against it specifically, not assumed from F13
        going green.'
      sha: 019fdcfcb94095cbeb88b206af1f6c7a61089172
      status: scheduled
    - by: orchestrator
      note: 'Fixed by phase 2 item 1, requirement R12 of `context/specs/phase2-ere-escaping.md`.
        `write_proxy_config` escaped only the literal dot; a new `_ere_literal` helper
        in `src/multiagents/executor/docker.py` now escapes exactly the twelve characters
        POSIX ERE treats as special outside a bracket expression. An entry `evil.com|.*`
        admits only its own literal text and refuses `anything.example`.


        **`re.escape` was considered and rejected, with a reason worth keeping.**
        It escapes for Python''s dialect, backslashing characters ERE does not treat
        as special — `-`, `&`, `~`, `#`, whitespace. POSIX leaves a backslash before
        an otherwise-ordinary character *undefined*; glibc''s `regcomp`, which tinyproxy
        links against, happens to read it as the literal, but that is implementation
        behaviour rather than a guarantee, and hostnames routinely contain `-`. The
        chosen table emits a backslash only before a character that is genuinely special,
        which POSIX defines unambiguously, so the divergence is avoided by construction
        rather than relied upon.


        A second implementation detail was deliberate: `str.translate` rather than
        `re.sub`, because `re.sub` raises `TypeError` on a non-string entry where
        `.replace()` raised `AttributeError`, and F2''s characterization test pins
        that exact type. An out-of-scope test stayed green because the implementer
        noticed.


        Verified: `tests/test_phase2_ere_escaping.py` 16/16, with F1''s case asserted
        against its own reproduction rather than inferred from the others going green
        — the brief''s instruction for this item. The characterization tests that
        pinned the defect were inverted separately, and each was checked to fail against
        the pre-R12 escaping, so none passes either way.'
      sha: 5bd61e06f937cf4a5005b7ac4398add08da705ca
      status: fixed
    severity: critical
    status: fixed
    summary: An `egress_allowlist` entry containing `|` turns the allowlist into an
      allow-all
