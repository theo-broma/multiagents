  F100:
    class: correctness
    context: context/review/C2-provider.md
    evidence: reproduction
    first_seen: 69b0f93de1b2b19a38e6b71cf427433255c6480e
    history:
    - by: auditor
      note: filed in context/review/C2-provider.md
      sha: 69b0f93de1b2b19a38e6b71cf427433255c6480e
      status: open
    - by: initializer
      note: 'BRIEF.md phase 1, item 8 — scheduled with the tickets rather than the
        findings, because it is what makes the suite trustworthy for everyone after
        it. budget._cache is a plain module-level dict keyed only by provider name,
        so tests bleed state through it. Verified 2026-09-17: tests/test_c2_provider_harness.py::test_read_provider_caches_until_invalidated
        passes in isolation and fails in the full suite. It is the single live red
        test, and an implement team cannot tell a regression from the baseline until
        it is green.'
      sha: 019fdcfcb94095cbeb88b206af1f6c7a61089172
      status: scheduled
    - by: orchestrator
      note: 'Fixed in `src/multiagents/budget.py` under `context/specs/phase1-budget-cache.md`
        (R10), phase 1 item 8.


        `read_provider`''s cache was keyed on provider name alone, so a second caller
        sharing a name but with a different `config_dir` silently received the first
        one''s cached `Budget`. A parallel table `_cache_source` now records which
        `config_dir` each entry came from, and a hit is served only when both the
        TTL and that source match the caller''s. `invalidate_cache()` clears both.


        **The finding''s own proposed fix was not taken, for a reason worth recording.**
        It suggested folding `config_dir` into `_cache`''s key. Two existing tests
        read `_cache[name]` directly as a plain `(timestamp, Budget)` 2-tuple, and
        changing the key or the value shape breaks both for reasons unrelated to this
        defect — they use one `config_dir` each and do not care about cross-config
        collision. The side table leaves `_cache`''s shape alone and fixes the actual
        behaviour.


        **This finding''s own proof test had to be retired, and that is the part to
        remember.** `test_two_unrelated_tests_sharing_a_provider_name_bleed_through_the_cache`
        existed to demonstrate the bleed and asserted the contaminated value; a second
        test pinned the same root cause more narrowly. No fix satisfying R10 could
        leave either true. The implementer raised it as `NEED_INFO` rather than touching
        them, and the test engineer inverted both — renamed to state what is now true,
        with comments naming F100 and saying the inversion is deliberate rather than
        a weakening. The first also gained a read in the opposite direction, so it
        now rules out bleeding both ways rather than only the one originally reproduced.


        That is the third time in this project that fixing a defect turned a test
        red because the test pinned the defect — after F150 and the `--init` characterization
        test. It is the same lesson each time and the cost is entirely in whether
        the reader can tell.


        **The suite is green.** 966 passed, 0 failed, 3 skipped, agreeing across three
        full runs in different `pytest-randomly` orderings. This was the repository''s
        one deliberate red test since the review, and `BRIEF.md` scheduled it into
        phase 1 precisely so that green would start meaning green.'
      sha: 39e721652911dbeaf8740b0830d114f85c6cc926
      status: fixed
    severity: high
    status: fixed
    summary: '`budget._cache` is a plain module-level dict keyed only by provider
      name, so unrelated tests reading the same provider name bleed state through
      it'
  F11:
    class: maintainability
    context: context/review/C1-sandbox-allowlist.md
    evidence: reproduction
    first_seen: 765a15b3bb1e1368599876e05c4630c434be83fe
    history:
    - by: auditor
      note: filed in context/review/C1-sandbox-allowlist.md
      sha: 765a15b3bb1e1368599876e05c4630c434be83fe
      status: open
    - by: orchestrator
      note: '**Blast-radius note, 2026-09-21 — status unchanged, ground moving.**
        Phase 2 item 1 rewrites the escaping in `write_proxy_config`, which is the
        code this finding is about. F11 records that a malformed entry (leading or
        trailing dot, whitespace, a port, a scheme with a path) silently matches nothing.
        Once every metacharacter is escaped literally, a malformed entry will match
        *something* — its own literal text — rather than nothing, so this finding''s
        observed behaviour changes even though nobody set out to change it.


        **Do not patch this from its current text.** Re-derive it against the rewritten
        function: the question "does a malformed entry tell the operator anything"
        survives the rewrite, but the answer and the reproduction both move. Left
        `open` rather than deferred because the underlying complaint — an entry that
        admits nothing, with no error — is real either way.'
      sha: 383d9d5ada708e5f337b72534818fc2b01c695fc
      status: open
    - by: orchestrator
      note: '**Partially resolved by phase 2 item 1 (R12), and left open deliberately.**
        Judgement by the test engineer that inverted the affected tests, not by me
        — I put the question to it because it had both tests in front of it, and its
        reasoning is better than my guess would have been.


        R12 escaped `^`, `$` and `\` as part of the full ERE escape table, so `a^b`,
        `a$b` and `a\b` now admit their own literal text instead of being unsatisfiable
        patterns. Those two reproductions are genuinely fixed and their tests are
        inverted.


        **Five reproductions in `tests/test_c1_allowlist_characterization.py` are
        untouched and still pass, still asserting a dead entry:** a leading dot (`.example.com`)
        still needs a literal double dot to match; a trailing dot matches only the
        FQDN root-dot form; leading or trailing whitespace is not stripped; a `:port`
        suffix never matches the bare host; a full URL never matches the bare host.
        Those are the *likelier* operator mistakes and they are the majority of the
        finding''s surface.


        **The deeper reason it is not closed:** F11''s complaint is that the operator
        gets a dead entry with no signal that it is dead. R12 changed what `a^b` matches;
        it did not add a signal. `a^b` is still dead in practice — no real request
        carries that host — merely dead for a different reason. The absence of validation
        is untouched, and that absence *is* the finding.


        Adjacent evidence from the same run: the two adversary fuzz tests were making
        two claims at once, and R12 removed only one. Nothing validates that an allowlist
        entry is a hostname; such an entry is still accepted in silence and still
        becomes part of the egress boundary. It is now inert rather than dangerous,
        which is the same conclusion reached from the adversary''s side.


        A comment above the two inverted tests records this, so the next reader sees
        the five that remain rather than assuming the finding closed.'
      sha: 5bd61e06f937cf4a5005b7ac4398add08da705ca
      status: open
    - by: initializer
      note: 'Partly fixed by ST9 (leading dot, public suffixes, IPv6 refused) but
        on main 67411d14 allowlist_entries still accepts " a.com" and "b.com:443"
        as allowed hosts. Plan context/plans/2026-10-13-findings-c1-c2-part2.md, item
        1: refuse them with a diagnostic.'
      sha: 67411d14a7270198eb42867ba588a9d66069501b
      status: scheduled
    - by: orchestrator
      note: SE2 + SE4 (hostname shape, anchored filter lines; adversary findings)
        + SE5/Decisions 16-17 (docker check), merged 84835473 + 2c73ed84.
      sha: 2c73ed84b7c6b8bc1c5317cfe5432ae36afbff53
      status: fixed
    severity: medium
    status: fixed
    summary: Dead or malformed entries (leading/trailing dot, whitespace, port) silently
      match nothing
