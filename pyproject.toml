[project]
name = "multiagents"
version = "0.1.0"
description = "MCP server that delegates work to other agent CLIs (opencode, antigravity) as supervised, git-isolated subagents"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2",
    "pyyaml>=6.0",
]

[dependency-groups]
# `uv sync` installs this group by default, so tests run without extra flags.
dev = [
    "pytest>=8.0",
]

[project.scripts]
multiagents = "multiagents.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/multiagents"]
